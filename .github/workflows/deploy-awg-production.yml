name: Deploy AWG Production

concurrency:
  group: awg-yandex-production-writer
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths:
      - .production/autoworld-release
  workflow_dispatch:
    inputs:
      telegram_lifecycle:
        description: Send the full physical lifecycle to a linked client and manager
        type: boolean
        default: false
      telegram_client_username:
        description: Telegram username for the physical client E2E
        type: string
        default: Flyer_kg
      telegram_client_id:
        description: Optional numeric Telegram user ID if the client has no linked lead yet
        type: string
        default: ''
      vk_enable:
        description: Explicitly enable VK client authentication and notifications for this manual production deployment
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.AWG_YC_FOLDER_ID || 'b1g8u8vqkgehvtbj8n13' }}
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  YC_RUNTIME_SA_ID: ${{ vars.AWG_YC_RUNTIME_SA_ID || 'aje8o9ric0d20k11521r' }}
  YC_REGISTRY_ID: ${{ vars.AWG_YC_REGISTRY_ID || 'crptu0l7jn0iui8b8laa' }}
  YC_CONTAINER_NAME: ${{ vars.AWG_YC_CONTAINER_NAME || 'autoworld-awg-prod' }}
  AWG_GATEWAY_NAME: ${{ vars.AWG_GATEWAY_NAME || 'autoworld-awg-prod' }}
  YDB_CONNECTION_STRING: ${{ vars.AWG_YDB_CONNECTION_STRING || 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etn00ojk5iv1u7dgpdar' }}
  AUTO_SALE_MEDIA_BUCKET: ${{ vars.AWG_MEDIA_BUCKET || 'viiversion-autoworld-awg-media' }}
  AWG_STATIC_BUCKET: ${{ vars.AWG_STATIC_BUCKET || 'viiversion-autoworld-awg-static-b1g8u8vqkgehvtbj8n13' }}
  AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AWG_TELEGRAM_BOT_TOKEN }}
  AUTOWORLD_RELAY_SECRET: ${{ secrets.AWG_RELAY_SECRET }}
  AUTO_SALE_CATALOG_IMPORT_KEY: ${{ secrets.AWG_RELAY_SECRET }}
  AUTO_SALE_MANAGER_CHAT_IDS: ${{ vars.AWG_MANAGER_CHAT_IDS || '' }}
  AUTO_SALE_TELEGRAM_APP_URL: ${{ vars.AWG_PRIMARY_APP_URL || 'https://awgcars.ru/' }}
  AUTO_SALE_TELEGRAM_RELAY_URL: https://integration-telegram.viiversion.com/telegram/send
  AUTO_SALE_YDB_DUAL_WRITE: "false"
  AUTO_SALE_LEGACY_STATE_WRITE: "false"
  AUTO_SALE_YDB_READ_MODE: normalized
  AUTO_SALE_ADMIN_TELEGRAM_USERNAMES: Flyer_Flyer,smit44744,Ivan_AWG
  AUTO_SALE_VK_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.vk_enable == true && 'true' || 'false' }}
  AUTO_SALE_VK_APP_ID: ${{ vars.AWG_VK_APP_ID || '54810434' }}
  AUTO_SALE_VK_GROUP_ID: ${{ vars.AWG_VK_GROUP_ID || '242103542' }}
  AUTO_SALE_VK_APP_SECRET: ${{ secrets.AWG_VK_APP_SECRET }}
  AUTO_SALE_VK_COMMUNITY_TOKEN: ${{ secrets.AWG_VK_COMMUNITY_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Validate Yandex configuration
        run: |
          set -euo pipefail
          for name in YC_FOLDER_ID YC_DEPLOY_SA_ID YC_RUNTIME_SA_ID YC_REGISTRY_ID YC_CONTAINER_NAME YDB_CONNECTION_STRING AUTO_SALE_MEDIA_BUCKET AWG_STATIC_BUCKET AUTO_SALE_TELEGRAM_APP_URL; do
            test -n "${!name:-}" || { echo "Missing production configuration: $name"; exit 1; }
          done
          for name in AUTO_SALE_TELEGRAM_BOT_TOKEN AUTOWORLD_RELAY_SECRET; do
            test -n "${!name:-}" || { echo "Missing required production secret: $name"; exit 1; }
          done
          BOT_USERNAME=$(curl -fsS "https://api.telegram.org/bot${AUTO_SALE_TELEGRAM_BOT_TOKEN}/getMe" | jq -r '.result.username // empty')
          test "$BOT_USERNAME" = "AutoWorld_Georgia_bot" || { echo "Unexpected Telegram bot: @$BOT_USERNAME"; exit 1; }
          if [[ "${AUTO_SALE_VK_ENABLED,,}" =~ ^(1|true|yes)$ ]]; then
            for name in AUTO_SALE_VK_APP_ID AUTO_SALE_VK_GROUP_ID AUTO_SALE_VK_APP_SECRET AUTO_SALE_VK_COMMUNITY_TOKEN; do
              test -n "${!name:-}" || { echo "VK enabled but missing production configuration: $name"; exit 1; }
            done
          fi

      - name: Validate application
        run: |
          npm ci
          npm run check

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Yandex token exchange failed with HTTP $HTTP_CODE"
            echo "$BODY" | jq -c . || echo "$BODY"
            exit 1
          fi
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Prepare YDB schema before runtime deploy
        run: |
          set -euo pipefail
          export YDB_ACCESS_TOKEN_CREDENTIALS="$YC_IAM_TOKEN"
          npm run prepare:ydb-runtime
          npm run initialize:ydb-domain
          npm run ensure:production-team

      - name: Install Yandex Cloud CLI
        run: |
          set -euo pipefail
          INSTALL_URL="https://storage.yandexcloud.net/yandexcloud-yc/install.sh"
          ARCHIVE_URL="https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz"
          INSTALL_OK=false
          for attempt in 1 2 3; do
            rm -f /tmp/yc-install.sh /tmp/yc_linux_amd64.tar.gz
            rm -rf /tmp/yc-direct
            if curl --connect-timeout 10 --max-time 120 --retry 2 --retry-all-errors --retry-delay 3 -fsSL "$INSTALL_URL" -o /tmp/yc-install.sh \
              && test -s /tmp/yc-install.sh \
              && bash /tmp/yc-install.sh -n; then
              INSTALL_OK=true
              break
            fi
            echo "Installer script unavailable; trying official direct CLI archive."
            mkdir -p /tmp/yc-direct
            if curl --connect-timeout 10 --max-time 180 --retry 2 --retry-all-errors --retry-delay 3 -fsSL "$ARCHIVE_URL" -o /tmp/yc_linux_amd64.tar.gz \
              && tar -xzf /tmp/yc_linux_amd64.tar.gz -C /tmp/yc-direct; then
              YC_BIN=$(find /tmp/yc-direct -type f -name yc -print -quit)
              if [ -n "$YC_BIN" ]; then
                mkdir -p "$HOME/yandex-cloud/bin"
                install -m 0755 "$YC_BIN" "$HOME/yandex-cloud/bin/yc"
                INSTALL_OK=true
                break
              fi
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Both Yandex CLI sources unavailable; retrying in ${delay}s (attempt ${attempt}/3)"
              sleep "$delay"
            fi
          done
          test "$INSTALL_OK" = "true" || { echo "Yandex Cloud CLI installation failed from installer and direct archive"; exit 1; }
          "$HOME/yandex-cloud/bin/yc" version
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"

      - name: Configure Yandex Cloud CLI from OIDC token
        run: |
          set -euo pipefail
          yc config set endpoint api.cloud.yandex.net:443
          yc config set token "$YC_IAM_TOKEN"
          yc config set folder-id "$YC_FOLDER_ID"
          yc config get endpoint | grep -Fx 'api.cloud.yandex.net:443'
          yc config get folder-id | grep -Fx "$YC_FOLDER_ID"

      - name: Publish static frontend to Yandex Object Storage
        run: |
          set -euo pipefail
          npm run build
          if ! yc storage bucket list --folder-id "$YC_FOLDER_ID" --format json \
            | jq -e --arg name "$AWG_STATIC_BUCKET" '.[] | select(.name == $name)' >/dev/null; then
            yc storage bucket create --name "$AWG_STATIC_BUCKET" --folder-id "$YC_FOLDER_ID" --max-size 1073741824
          fi
          yc storage s3 rm "s3://$AWG_STATIC_BUCKET/" --recursive --quiet || true
          yc storage s3 cp dist/ "s3://$AWG_STATIC_BUCKET/" --recursive \
            --cache-control 'public, max-age=300, stale-while-revalidate=86400' \
            --only-show-errors
          yc storage s3 cp dist/index.html "s3://$AWG_STATIC_BUCKET/index.html" \
            --cache-control 'no-cache, no-store, must-revalidate' \
            --content-type 'text/html; charset=utf-8' \
            --only-show-errors
          yc storage s3api head-object --bucket "$AWG_STATIC_BUCKET" --key index.html >/dev/null
          yc storage s3api head-object --bucket "$AWG_STATIC_BUCKET" --key auto-sale-bootstrap.mjs >/dev/null

      - name: Build and push image
        run: |
          set -euo pipefail
          IMAGE="cr.yandex/${YC_REGISTRY_ID}/autoworld-awg:${GITHUB_SHA}"
          echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          docker build -f Dockerfile.yandex -t "$IMAGE" .
          PUSH_OK=false
          for attempt in 1 2 3; do
            if docker push "$IMAGE"; then
              PUSH_OK=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 15))
              echo "Yandex Container Registry push failed; retrying in ${delay}s (attempt ${attempt}/3)"
              sleep "$delay"
              echo "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
            fi
          done
          test "$PUSH_OK" = "true" || { echo "Yandex Container Registry push failed after 3 attempts"; exit 1; }
          echo "AUTO_SALE_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Generate AWG production API credential
        run: |
          set -euo pipefail
          AUTO_SALE_API_KEY=$(openssl rand -hex 32)
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"
          printf '%s' "$AUTO_SALE_API_KEY" > "$RUNNER_TEMP/auto-sale-api-key"

      - name: Deploy isolated AWG production container
        run: |
          set -euo pipefail
          yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" >/dev/null 2>&1 || \
            yc serverless container create --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID"
          EXTRA_ENV=()
          if [ -n "${AUTO_SALE_TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::add-mask::$AUTO_SALE_TELEGRAM_BOT_TOKEN"
            EXTRA_ENV+=(--environment "AUTO_SALE_TELEGRAM_BOT_TOKEN=$AUTO_SALE_TELEGRAM_BOT_TOKEN")
            EXTRA_ENV+=(--environment "AUTO_SALE_TELEGRAM_APP_URL=$AUTO_SALE_TELEGRAM_APP_URL")
            EXTRA_ENV+=(--environment "AUTO_SALE_TELEGRAM_RELAY_URL=$AUTO_SALE_TELEGRAM_RELAY_URL")
            if [ -n "${AUTOWORLD_RELAY_SECRET:-}" ]; then
              echo "::add-mask::$AUTOWORLD_RELAY_SECRET"
              EXTRA_ENV+=(--environment "AUTOWORLD_RELAY_SECRET=$AUTOWORLD_RELAY_SECRET")
            fi
          fi
          if [ -n "${AUTO_SALE_CATALOG_IMPORT_KEY:-}" ]; then
            echo "::add-mask::$AUTO_SALE_CATALOG_IMPORT_KEY"
            EXTRA_ENV+=(--environment "AUTO_SALE_CATALOG_IMPORT_KEY=$AUTO_SALE_CATALOG_IMPORT_KEY")
          fi
          if [ -n "${AUTO_SALE_MANAGER_CHAT_IDS:-}" ]; then
            EXTRA_ENV+=(--environment "AUTO_SALE_MANAGER_CHAT_IDS=$AUTO_SALE_MANAGER_CHAT_IDS")
          fi
          EXTRA_ENV+=(--environment "AUTO_SALE_VK_ENABLED=$AUTO_SALE_VK_ENABLED")
          if [[ "${AUTO_SALE_VK_ENABLED,,}" =~ ^(1|true|yes)$ ]]; then
            echo "::add-mask::$AUTO_SALE_VK_APP_SECRET"
            echo "::add-mask::$AUTO_SALE_VK_COMMUNITY_TOKEN"
            EXTRA_ENV+=(--environment "AUTO_SALE_VK_APP_ID=$AUTO_SALE_VK_APP_ID")
            EXTRA_ENV+=(--environment "AUTO_SALE_VK_APP_SECRET=$AUTO_SALE_VK_APP_SECRET")
            EXTRA_ENV+=(--environment "AUTO_SALE_VK_GROUP_ID=$AUTO_SALE_VK_GROUP_ID")
            EXTRA_ENV+=(--environment "AUTO_SALE_VK_COMMUNITY_TOKEN=$AUTO_SALE_VK_COMMUNITY_TOKEN")
          fi
          yc serverless container revision deploy \
            --container-name "$YC_CONTAINER_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --image "$AUTO_SALE_IMAGE" \
            --cores 1 \
            --memory 512MB \
            --execution-timeout 60s \
            --service-account-id "$YC_RUNTIME_SA_ID" \
            --environment "YDB_CONNECTION_STRING=$YDB_CONNECTION_STRING" \
            --environment "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" \
            --environment "AUTO_SALE_BUILD_SHA=$GITHUB_SHA" \
            --environment "AUTO_SALE_PUBLIC_DEMO_WRITE=false" \
            --environment "AUTO_SALE_LEGACY_STATE_WRITE=$AUTO_SALE_LEGACY_STATE_WRITE" \
            --environment "AUTO_SALE_YDB_DUAL_WRITE=$AUTO_SALE_YDB_DUAL_WRITE" \
            --environment "AUTO_SALE_YDB_READ_MODE=$AUTO_SALE_YDB_READ_MODE" \
            --environment "AUTO_SALE_ADMIN_TELEGRAM_USERNAMES=$AUTO_SALE_ADMIN_TELEGRAM_USERNAMES" \
            --environment "AUTO_SALE_MEDIA_BUCKET=$AUTO_SALE_MEDIA_BUCKET" \
            "${EXTRA_ENV[@]}"

      - name: Diagnose Yandex runtime logs
        run: |
          set +e
          echo "=== Container ==="
          yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID"
          echo "=== Recent runtime logs ==="
          timeout 20s yc logging read --folder-id "$YC_FOLDER_ID" --since 20m --limit 200 --format json || true

      - name: Route static frontend through Object Storage
        run: |
          set -euo pipefail
          yc serverless api-gateway update \
            --name "$AWG_GATEWAY_NAME" \
            --folder-id "$YC_FOLDER_ID" \
            --spec=infra/yandex/awg-production-gateway.yaml
          for attempt in $(seq 1 20); do
            INDEX_CODE=$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/awg-index.html -w '%{http_code}' https://awgcars.ru/ || true)
            APP_CODE=$(curl --connect-timeout 5 --max-time 10 -sS -o /tmp/awg-bootstrap.mjs -w '%{http_code}' https://awgcars.ru/auto-sale-bootstrap.mjs || true)
            if [ "$INDEX_CODE" = "200" ] && [ "$APP_CODE" = "200" ] \
              && grep -q 'auto-sale-bootstrap.mjs' /tmp/awg-index.html \
              && grep -q 'pullInitialState' /tmp/awg-bootstrap.mjs; then
              break
            fi
            test "$attempt" -lt 20 || { echo "Static Object Storage route did not become healthy"; exit 1; }
            sleep 3
          done
          curl --connect-timeout 5 --max-time 10 -sS -o /dev/null \
            -w 'Static index TTFB=%{time_starttransfer}s total=%{time_total}s\n' https://awgcars.ru/
          curl --connect-timeout 5 --max-time 10 -sS -o /dev/null \
            -w 'Static bootstrap TTFB=%{time_starttransfer}s total=%{time_total}s\n' https://awgcars.ru/auto-sale-bootstrap.mjs

      - name: Resolve production container URL
        run: |
          set -euo pipefail
          URL=$(yc serverless container get --name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq -r '.url')
          test -n "$URL" && test "$URL" != "null"
          echo "AWG_URL=$URL" >> "$GITHUB_ENV"

      - name: Resolve and verify AWG API Gateway before Telegram webhook
        run: |
          set -euo pipefail
          GW_JSON=$(yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --format json)
          GW_DOMAIN=$(printf '%s' "$GW_JSON" | jq -r '.domain')
          test -n "$GW_DOMAIN" && test "$GW_DOMAIN" != "null"
          echo "AWG_GATEWAY_URL=https://$GW_DOMAIN/" >> "$GITHUB_ENV"
          # All post-deploy HTTP checks must go through the public API Gateway.
          # The underlying Serverless Container is intentionally private and returns 403 directly.
          echo "AWG_URL=https://$GW_DOMAIN/" >> "$GITHUB_ENV"
          echo "STAGING_URL=https://$GW_DOMAIN/" >> "$GITHUB_ENV"
          echo "AUTO_SALE_TELEGRAM_WEBHOOK_BASE_URL=https://$GW_DOMAIN/" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 10 --max-time 20 -fsS "https://$GW_DOMAIN/api/health" | jq -e '.ok == true and .persistence == "ydb-serverless"' >/dev/null; then
              break
            fi
            test "$attempt" -lt 30 || exit 1
            sleep 5
          done
          curl --connect-timeout 10 --max-time 20 -fsS "https://$GW_DOMAIN/api/health" | jq '{ok,persistence,buildSha,telegramNotifications,telegramRoutingReady,telegramRoutableManagers}'

      - name: Verify existing Telegram relay health
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 20 -fsS https://integration-telegram.viiversion.com/telegram/health \
            | jq -e '.ok == true' >/dev/null

      - name: Verify authenticated Telegram relay path
        env:
          RELAY_SECRET: ${{ secrets.AWG_RELAY_SECRET }}
        run: |
          set -euo pipefail
          PAYLOAD='{"chatId":"0","text":"autoworld production relay probe"}'
          TS=$(date +%s%3N)
          SIG=$(printf '%s' "$TS.$PAYLOAD" | openssl dgst -sha256 -hmac "$RELAY_SECRET" -hex | awk '{print $2}')
          CODE=$(curl -sS -o /tmp/relay-auth-probe.json -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H "x-relay-timestamp: $TS" \
            -H "x-relay-signature: $SIG" \
            --data "$PAYLOAD" "$AUTO_SALE_TELEGRAM_RELAY_URL")
          test "$CODE" = "502"
          jq -e '.error == "telegram_api_error"' /tmp/relay-auth-probe.json >/dev/null

      - name: Configure Telegram Mini App and webhook
        env:
          AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AWG_TELEGRAM_BOT_TOKEN }}
        run: node scripts/configure-autoworld-telegram-bot.mjs

      - name: Verify Telegram RBAC read/write boundary
        run: |
          set -euo pipefail
          URL=${AWG_GATEWAY_URL%/}
          test -n "$URL"
          echo "AWG_URL=$URL" >> "$GITHUB_ENV"
          # Re-export the exact generated credential after deployment so every protected
          # live-delivery check uses the same bytes that were injected into the revision.
          AUTO_SALE_API_KEY=$(cat "$RUNNER_TEMP/auto-sale-api-key")
          echo "::add-mask::$AUTO_SALE_API_KEY"
          echo "AUTO_SALE_API_KEY=$AUTO_SALE_API_KEY" >> "$GITHUB_ENV"
          for attempt in $(seq 1 20); do
            if curl -fsS "${URL%/}/api/health" | jq -e '.ok == true and .persistence == "ydb-serverless" and .writeMode == "telegram-rbac" and .stateReadMode == "viewer-filtered" and .publicDemoWrite == false and .maxAdminAccounts == 3 and .adminInvites == 3 and (.linkedAdminAccounts|tonumber) <= 3 and .legacyStateWrite == "retired" and .normalizedAuthoritative == true and .ydbDomainDualWrite == "disabled" and .ydbStateReadMode == "normalized" and .mediaStorage == "object-storage" and .mediaBucket == env.AUTO_SALE_MEDIA_BUCKET and .telegramNotifications == "enabled" and (.telegramRoutableManagers|tonumber) == 3 and .buildSha == env.GITHUB_SHA' >/dev/null; then
              break
            fi
            test "$attempt" -lt 20 || exit 1
            sleep 5
          done
          curl -fsS "${URL%/}/api/auto-sale/state" \
            | jq -e '.initialized == true and (.revision|tonumber) >= 1 and ._access.role == "public" and (.leads|length) == 0 and (.quotes|length) == 0 and (.orders|length) == 0 and (.team|length) == 0 and (.catalog|type) == "array"' >/dev/null
          curl -fsS -H "x-auto-sale-key: $AUTO_SALE_API_KEY" "${URL%/}/api/auto-sale/state" \
            | jq -e '.initialized == true and ._access.role == "admin" and ._access.authenticated == true and (.team|type) == "array"' >/dev/null
          echo "Yandex Telegram RBAC production verified: $URL"

      - name: Verify two-client production smoke
        run: |
          set -euo pipefail
          SMOKE=$(curl -fsS -X POST \
            -H "x-auto-sale-key: $AUTO_SALE_API_KEY" \
            https://awgcars.ru/api/auto-sale/smoke/two-client)
          printf '%s' "$SMOKE" | jq -e '
            .ok == true
            and .checks.distinctLeadIds == true
            and .checks.firstClientOwnsOnlyFirst == true
            and .checks.secondClientOwnsOnlySecond == true
            and .checks.managerNotificationPlannedForBoth == true
            and .checks.clientConfirmationPlannedForBoth == true
            and .cleanup.ok == true
          ' >/dev/null
          printf '%s' "$SMOKE" | jq '{ok,checks,planned,cleanup}'

      - name: Verify linked manager Telegram delivery
        run: |
          set -euo pipefail
          DELIVERY=$(curl --connect-timeout 10 --max-time 45 -fsS -X POST \
            -H "x-auto-sale-key: $AUTO_SALE_API_KEY" \
            https://awgcars.ru/api/auto-sale/telegram/test-manager-delivery)
          printf '%s' "$DELIVERY" | jq -e '.ok == true and (.messageId != null)' >/dev/null
          printf '%s' "$DELIVERY" | jq '{ok,member,messageId}'

      - name: Verify real non-admin Telegram client E2E
        run: |
          set -euo pipefail
          RUN_REAL_CLIENT_E2E=$(awk -F= '$1=="run_real_client_e2e"{print $2}' .production/autoworld-release | tail -n1)
          if [ "$RUN_REAL_CLIENT_E2E" != "true" ]; then
            echo "Real physical client E2E not requested by release marker."
            exit 0
          fi
          CLIENT_USERNAME=$(awk -F= '$1=="real_client_username"{print $2}' .production/autoworld-release | tail -n1)
          export AUDIT_CLIENT_TELEGRAM_USERNAME="${CLIENT_USERNAME:-Flyer_kg}"
          export STAGING_URL="https://awgcars.ru"
          node scripts/test-real-telegram-client-e2e.mjs

      - name: Upload real Telegram client E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-telegram-client-e2e
          path: real-client-e2e-report.json
          if-no-files-found: ignore

      - name: Verify normalized YDB read source
        run: |
          set -euo pipefail
          curl -fsS -H "x-auto-sale-key: $AUTO_SALE_API_KEY" "${AWG_URL%/}/api/auto-sale/admin/read-parity" \
            | tee /tmp/read-parity.json \
            | jq -e '.ok == true and .configuredMode == "normalized" and .source == "normalized" and .fallback == false and .authoritative == true and .shadowVerified == false and (.revision|tonumber) >= 1' >/dev/null

      - name: Verify optimistic entity API live
        run: |
          set -euo pipefail
          node scripts/test-ydb-entity-api-live.mjs

      - name: Upload entity API live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ydb-entity-api-live-report
          path: ydb-entity-api-live-report.json
          if-no-files-found: ignore

      - name: Verify Phase 5 frontend batch persistence
        run: |
          set -euo pipefail
          node scripts/test-ydb-frontend-batch-live.mjs

      - name: Upload Phase 5 frontend batch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ydb-frontend-batch-live-report
          path: ydb-frontend-batch-live-report.json
          if-no-files-found: ignore

      - name: Verify legacy whole-state write is retired
        if: always()
        run: |
          set -euo pipefail
          URL=${AWG_URL%/}
          for mode in public authenticated; do
            headers=(-H 'content-type: application/json')
            if [ "$mode" = authenticated ]; then
              headers+=(-H "x-auto-sale-key: $AUTO_SALE_API_KEY")
            fi
            code=$(curl -sS -o /tmp/legacy-write-${mode}.json -w '%{http_code}' -X PUT "${headers[@]}" \
              --data '{"baseRevision":0,"leads":[],"quotes":[],"orders":[],"notes":{},"team":[],"catalog":[]}' \
              "$URL/api/auto-sale/state")
            test "$code" = "410"
            jq -e '.error == "legacy_state_write_retired"' /tmp/legacy-write-${mode}.json >/dev/null
          done

      - name: Archive frozen legacy compatibility snapshot
        if: always()
        run: |
          set -euo pipefail
          curl -fsS -H "x-auto-sale-key: $AUTO_SALE_API_KEY" \
            "${AWG_URL%/}/api/auto-sale/admin/legacy-snapshot" \
            | tee legacy-retirement-snapshot.json \
            | jq -e '.ok == true and .retired == true and (.revision|tonumber) >= 0 and (.state|type) == "object"' >/dev/null

      - name: Upload legacy retirement snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-retirement-snapshot
          path: legacy-retirement-snapshot.json
          if-no-files-found: error

      - name: Verify manager and director scenarios through real UI
        if: always()
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts playwright@1.55.0
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          test -n "$CHROME"
          PLAYWRIGHT_CHROME_PATH="$CHROME" node scripts/test-ui-manager-director-live.mjs

      - name: Upload Phase 6 UI scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase6-manager-director-ui
          path: |
            phase6-ui-manager-director-report.json
            phase6-manager.png
            phase6-director.png
          if-no-files-found: ignore

      - name: Diagnose Yandex and Cloudflare Telegram relay
        if: always()
        run: |
          set -euo pipefail
          URL=${AWG_URL%/}
          echo "Production URL: $URL"
          curl -fsS "$URL/api/health" | jq '{ok,telegramNotifications,telegramFallbackManagers}'
          echo "Cloudflare relay reachability:"
          relay_code=$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/relay-probe -w '%{http_code}' "$AUTO_SALE_TELEGRAM_RELAY_URL" || true)
          echo "Relay HTTP: $relay_code"
          test "$relay_code" != "000"
          echo "Revision network configuration:"
          yc serverless container revision list --container-name "$YC_CONTAINER_NAME" --folder-id "$YC_FOLDER_ID" --format json | jq '.[0] | {id,status,network_id,subnet_id,created_at}' || true

      - name: Verify physical Telegram lifecycle
        if: ${{ always() && inputs.telegram_lifecycle == true }}
        env:
          AUDIT_CLIENT_TELEGRAM_USERNAME: ${{ inputs.telegram_client_username || 'Flyer_kg' }}
          AUDIT_CLIENT_TELEGRAM_ID: ${{ inputs.telegram_client_id || '' }}
        run: node scripts/test-telegram-lifecycle.mjs

      - name: Upload Telegram delivery receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-lifecycle-report
          path: telegram-lifecycle-report.json
          if-no-files-found: ignore

