name: Verify AWG Ads Attribution (isolated)
on:
  push:
    branches:
      - feature/awg-ads-attribution
    paths:
      - server/ads-attribution-core.mjs
      - server/ads-attribution-ydb.mjs
      - server/ads-attribution-report.mjs
      - server/ads-attribution-privacy.mjs
      - tests/ads-attribution.test.mjs
      - tests/ads-attribution-report.test.mjs
      - tests/ads-attribution-ydb-adapter.test.mjs
      - tests/ads-attribution-privacy.test.mjs
      - scripts/test-awg-ads-local-ydb.mjs
      - .github/workflows/verify-awg-ads-local-ydb.yml
      - docs/AWG_ADS_ATTRIBUTION_STAGE_A.md
      - .github/workflows/verify-awg-ads-attribution.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify isolation from AutoWorld production code
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          base="$(git merge-base HEAD origin/main)"
          changed="$(git diff --name-only "$base" HEAD)"
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            case "$path" in
              server/ads-attribution-core.mjs|server/ads-attribution-ydb.mjs|server/ads-attribution-report.mjs|server/ads-attribution-privacy.mjs|tests/ads-attribution.test.mjs|tests/ads-attribution-report.test.mjs|tests/ads-attribution-ydb-adapter.test.mjs|tests/ads-attribution-privacy.test.mjs|scripts/test-awg-ads-local-ydb.mjs|.github/workflows/verify-awg-ads-local-ydb.yml|docs/AWG_ADS_ATTRIBUTION_STAGE_A.md|.github/workflows/verify-awg-ads-attribution.yml) ;;
              *) echo "::error::Unsafe AWG Ads branch path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
      - name: Install locked YDB SDK dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax checks
        run: |
          node --check server/ads-attribution-core.mjs
          node --check server/ads-attribution-ydb.mjs
          node --check server/ads-attribution-report.mjs
          node --check server/ads-attribution-privacy.mjs
          node --check tests/ads-attribution.test.mjs
          node --check tests/ads-attribution-report.test.mjs
          node --check tests/ads-attribution-ydb-adapter.test.mjs
          node --check tests/ads-attribution-privacy.test.mjs
          node --check scripts/test-awg-ads-local-ydb.mjs
      - name: Unit tests without network, secrets or database
        run: node --test tests/ads-attribution*.test.mjs
