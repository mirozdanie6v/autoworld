name: AWG gallery preflight (read-only)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - scripts/backfill-awg-source-gallery.py
      - tests/test_awg_gallery_backfill.py
      - scripts/import-autoworld-catalog.mjs
      - .github/workflows/backfill-awg-source-gallery.yml
      - .github/workflows/sync-awg-catalog.yml

permissions:
  contents: read

concurrency:
  group: awg-gallery-preview
  cancel-in-progress: false

jobs:
  media-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Regression tests (read-only)
        run: python -m unittest discover -s tests -p test_awg_gallery_backfill.py -v
      - name: Verify actual source photos without mutations
        run: python scripts/backfill-awg-source-gallery.py --scope pilot
      - name: Upload preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awg-gallery-readonly-preview
          path: |
            /tmp/awg-gallery/report.json
            /tmp/awg-gallery/media-backup.json
          if-no-files-found: warn
          retention-days: 30
