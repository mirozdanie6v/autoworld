name: Diagnose VK Production Open

on:
  push:
    branches: [diag-vk-prod-open]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed manager-refresh fix
        run: |
          set -euo pipefail
          APP=https://awgcars.ru/auto-sale-telegram.mjs
          HEALTH=https://d5dbgio6limv03usvipl.s183zexc.apigw.yandexcloud.net/api/health
          curl -L -fsS --connect-timeout 5 --max-time 15 "$APP" -o /tmp/tg.mjs
          curl -L -fsS --connect-timeout 5 --max-time 15 "$HEALTH" -o /tmp/health.json
          jq '{ok,buildSha,vkAuth,vkMessaging,telegramRoutableManagers}' /tmp/health.json
          echo "TG_BYTES $(wc -c </tmp/tg.mjs)"
          if grep -Fq 'function refreshOpenClientDetail()' /tmp/tg.mjs; then echo "REFRESH_FIX=true"; else echo "REFRESH_FIX=false"; fi
          if grep -Fq "queueMicrotask(refreshOpenClientDetail)" /tmp/tg.mjs; then echo "REFRESH_HOOK=true"; else echo "REFRESH_HOOK=false"; fi
          grep -Fq 'function refreshOpenClientDetail()' /tmp/tg.mjs
          grep -Fq "queueMicrotask(refreshOpenClientDetail)" /tmp/tg.mjs
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.buildSha' /tmp/health.json)" = "d7ab181874e62feae1891abdd34b2e225b925de6"
          test "$(jq -r '.vkAuth' /tmp/health.json)" = "enabled"
          test "$(jq -r '.vkMessaging' /tmp/health.json)" = "enabled"
