name: Diagnose VK Production Open

on:
  push:
    branches: [diag-vk-prod-open]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify deployed client order details fix
        run: |
          set -euo pipefail
          APP=https://awgcars.ru/auto-sale-app-v3.mjs
          HEALTH=https://d5dbgio6limv03usvipl.s183zexc.apigw.yandexcloud.net/api/health
          curl -L -fsS --connect-timeout 5 --max-time 15 "$APP" -o /tmp/app.mjs
          curl -L -fsS --connect-timeout 5 --max-time 15 "$HEALTH" -o /tmp/health.json
          echo "HEALTH"
          jq '{ok,persistence,buildSha,vkAuth,vkMessaging,telegramRoutableManagers}' /tmp/health.json
          echo "APP_BYTES $(wc -c </tmp/app.mjs)"
          if grep -Fq 'data-client-lead="${esc(lead.id)}"' /tmp/app.mjs; then echo "CORE_CLIENT_LEAD_MARKER=true"; else echo "CORE_CLIENT_LEAD_MARKER=false"; fi
          if grep -Fq '<span>Открыть подробности</span><strong>→</strong>' /tmp/app.mjs; then echo "IMMEDIATE_DETAILS_HINT=true"; else echo "IMMEDIATE_DETAILS_HINT=false"; fi
          grep -Fq 'data-client-lead="${esc(lead.id)}"' /tmp/app.mjs
          grep -Fq '<span>Открыть подробности</span><strong>→</strong>' /tmp/app.mjs
          test "$(jq -r '.ok' /tmp/health.json)" = "true"
          test "$(jq -r '.buildSha' /tmp/health.json)" = "45d376b2510ecae2914bb29764ec4e98fa2dfb85"
          test "$(jq -r '.vkAuth' /tmp/health.json)" = "enabled"
          test "$(jq -r '.vkMessaging' /tmp/health.json)" = "enabled"
