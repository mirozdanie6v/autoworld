name: Diagnose VK Production Open

on:
  push:
    branches: [diag-vk-prod-open]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Measure live AWG after static cutover
        run: |
          set -euo pipefail
          measure() {
            name="$1"; url="$2"
            for n in 1 2 3; do
              curl -L -sS --connect-timeout 5 --max-time 20 -o /tmp/body \
                -w "PERF $name run=$n code=%{http_code} bytes=%{size_download} ttfb=%{time_starttransfer} total=%{time_total}\n" \
                "$url"
            done
          }
          measure index https://awgcars.ru/
          measure bootstrap https://awgcars.ru/auto-sale-bootstrap.mjs
          measure app https://awgcars.ru/auto-sale-app-v3.mjs
          measure health https://awgcars.ru/api/health
          echo HEALTH_JSON
          curl -L -fsS --connect-timeout 5 --max-time 20 https://awgcars.ru/api/health \
            | jq '{ok,buildSha,vkAuth,vkMessaging,telegramRoutableManagers}'
