name: Diagnose VK Production Open

on:
  push:
    branches: [diag-vk-prod-open]

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe current production
        run: |
          set -euo pipefail
          for pair in             "awg|https://awgcars.ru/"             "health|https://d5dbgio6limv03usvipl.s183zexc.apigw.yandexcloud.net/api/health"             "vkmodule|https://awgcars.ru/auto-sale-vk.mjs"             "appmodule|https://awgcars.ru/auto-sale-app-v3.mjs"
          do
            name="${pair%%|*}"; url="${pair#*|}"
            code=$(curl -L -sS --connect-timeout 5 --max-time 10 -o "/tmp/$name.body" -w '%{http_code}' "$url" || true)
            bytes=$(wc -c <"/tmp/$name.body" 2>/dev/null || echo 0)
            echo "PROBE $name code=$code bytes=$bytes"
          done
          echo "HEALTH_JSON"
          cat /tmp/health.body | jq '{ok,persistence,buildSha,vkAuth,vkMessaging,telegramRoutableManagers}' || true
          test "$(grep -c 'auto-sale' /tmp/awg.body || true)" -gt 0
          test "$(wc -c </tmp/vkmodule.body)" -gt 100
          test "$(wc -c </tmp/appmodule.body)" -gt 1000
          test "$(jq -r '.ok' /tmp/health.body)" = "true"
