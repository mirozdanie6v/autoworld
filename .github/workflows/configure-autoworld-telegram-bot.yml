name: Configure AutoWorld Telegram bot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTO_SALE_TELEGRAM_APP_URL: https://bba01u6g86lg2q49p34d.containers.yandexcloud.net/
  AUTO_SALE_TELEGRAM_WEBHOOK_BASE_URL: https://viiversion-telegram-relay.mirozdanie6v.workers.dev/telegram/webhook

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate Telegram bot secret
        env:
          AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: |
          test -n "$AUTO_SALE_TELEGRAM_BOT_TOKEN" || { echo "Missing secret AUTO_SALE_TELEGRAM_BOT_TOKEN"; exit 1; }
      - name: Configure bot and Mini App menu
        env:
          AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AUTO_SALE_TELEGRAM_BOT_TOKEN }}
        run: node scripts/configure-autoworld-telegram-bot.mjs
