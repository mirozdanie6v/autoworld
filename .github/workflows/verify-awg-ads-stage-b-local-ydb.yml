name: Verify AWG Ads Stage B on real local YDB
on:
  push:
    branches: [feature/awg-ads-stage-b-integration]
    paths:
      - 'server/ads-*'
      - 'server/telegram-bot.mjs'
      - 'server/auto-sale-access.mjs'
      - 'scripts/test-awg-ads-stage-b-local-ydb.mjs'
      - '.github/workflows/verify-awg-ads-stage-b-local-ydb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage-b-local-ydb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AWG_ADS_LOCAL_YDB_TEST: 'yes'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start disposable localhost-only YDB
        run: |
          set -euo pipefail
          docker run -d --rm --name awg-b-local-ydb --hostname localhost \
            --platform linux/amd64 -p 127.0.0.1:2136:2136 \
            -e GRPC_PORT=2136 -e YDB_USE_IN_MEMORY_PDISKS=true \
            ydbplatform/local-ydb:latest
          timeout 180 bash -c 'until (echo > /dev/tcp/127.0.0.1/2136) >/dev/null 2>&1; do sleep 3; done'
          sleep 8
      - name: Trusted bot start, CRM snapshot and conversion receipt using real SQL
        run: node scripts/test-awg-ads-stage-b-local-ydb.mjs
      - name: Stop disposable YDB
        if: always()
        run: docker rm -f awg-b-local-ydb || true
