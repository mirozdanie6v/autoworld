name: Audit production Telegram webhook and start replies (read only)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-awg-telegram-prod-webhook.yml
      - scripts/audit-awg-telegram-prod-webhook.mjs
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: awg-telegram-webhook-audit
  cancel-in-progress: false
env:
  YC_FOLDER_ID: b1g8u8vqkgehvtbj8n13
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Request existing Yandex federation identity
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Exchange identity and install official Yandex CLI
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOY_SA_ID" \
            --data-urlencode "subject_token=$GITHUB_OIDC_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          TOKEN=$(printf '%s' "$RESPONSE" | jq -er '.access_token')
          echo "::add-mask::$TOKEN"
          echo "YC_IAM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 90 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/yc.tar.gz"
          mkdir -p "$RUNNER_TEMP/yc-dist" "$RUNNER_TEMP/yc-bin"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc-dist"
          BIN=$(find "$RUNNER_TEMP/yc-dist" -type f -name yc -print -quit)
          test -n "$BIN"
          install -m 0755 "$BIN" "$RUNNER_TEMP/yc-bin/yc"
          echo "$RUNNER_TEMP/yc-bin" >> "$GITHUB_PATH"
      - name: Read verified running production bot credentials without logging
        run: |
          set -euo pipefail
          yc config set endpoint api.cloud.yandex.net:443
          yc config set token "$YC_IAM_TOKEN"
          yc config set folder-id "$YC_FOLDER_ID"
          CID=$(yc serverless container get --name autoworld-awg-prod --format json | jq -er '.id')
          test "$CID" = bba691o7au7epjqvs77b
          yc serverless container revision list --container-id "$CID" --format json > "$RUNNER_TEMP/revs.json"
          RID=$(jq -er '(if type=="array" then . else .revisions end) | map(select(.status=="ACTIVE")) | sort_by(.created_at // .createdAt) | last | .id' "$RUNNER_TEMP/revs.json")
          yc serverless container revision get "$RID" --format json > "$RUNNER_TEMP/prod.json"
          jq -e '.image.environment.YDB_CONNECTION_STRING|endswith("/etn00ojk5iv1u7dgpdar")' "$RUNNER_TEMP/prod.json" >/dev/null
          jq -e '.image.environment.AUTO_SALE_PUBLIC_DEMO_WRITE=="false"' "$RUNNER_TEMP/prod.json" >/dev/null
          for KEY in AUTO_SALE_API_KEY AUTO_SALE_TELEGRAM_BOT_TOKEN; do
            VALUE=$(jq -er --arg key "$KEY" '.image.environment[$key]|select(length>0)' "$RUNNER_TEMP/prod.json")
            echo "::add-mask::$VALUE"
            echo "$KEY=$VALUE" >> "$GITHUB_ENV"
          done
          echo "Production runtime and YDB checked; no webhook config changes."
          jq -c '{relayRouteConfigured:(.image.environment.AUTO_SALE_TELEGRAM_RELAY_URL=="https://integration-telegram.viiversion.com/telegram/send"),relaySigningKeyPresent:((.image.environment.AUTOWORLD_RELAY_SECRET//"")|length>0),notificationPumpConfigured:(.image.environment.AUTO_SALE_NOTIFICATION_PUMP_ENABLED//"default")}' "$RUNNER_TEMP/prod.json" | sed 's/^/AWG_PRODUCTION_TELEGRAM_DELIVERY_MODE /'
      - name: Inspect sanitized production revision settings for safe notification hotfix
        run: |
          set -euo pipefail
          jq -c '{
            revisionId:.id,
            imagePresent:((.image.image//"")|length>0),
            imageValueType:(.image.image|type),
            resources:.resources,
            executionTimeout:.execution_timeout,
            serviceAccountId:.service_account_id,
            connectivity:.connectivity,
            revisionKeys:keys,
            imageKeys:(.image|keys),
            imageEnvNames:(.image.environment|keys),
            secretBindings:.secrets,
            imageUrlPresent:((.image.image_url//"")|length>0),
            runtime:.runtime,
            concurrency:.concurrency,
            metadataOptions:.metadata_options,
            logOptions:.log_options,
            vkEnabled:(.image.environment.AUTO_SALE_VK_ENABLED=="true"),
            vkWebEnabled:(.image.environment.AUTO_SALE_VK_WEB_ENABLED=="true"),
            webhookAppUrl:.image.environment.AUTO_SALE_TELEGRAM_APP_URL,
            staticBucket:.image.environment.AUTO_SALE_MEDIA_BUCKET
          }' "$RUNNER_TEMP/prod.json" | sed 's/^/AWG_PRODUCTION_REVISION_SAFE_SNAPSHOT /'
      - name: Verify the live notification hotfix and Telegram Mini App navigation files
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 10 --max-time 35 \
            https://awgcars.ru/api/health \
            | jq -e '.ok==true and .buildSha=="18532cca70755fcac8b29575f986fba4bbc2d812" and .vkMessaging=="enabled" and .telegramNotifications=="enabled" and .telegramRoutableManagers==3' >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 35 \
            "https://awgcars.ru/?awg_hotfix_check=telegram20261015" \
            | grep -F '20261015-tg-deeplinks-v1' >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 35 \
            "https://awgcars.ru/auto-sale-bootstrap.mjs?v=20261015-tg-deeplinks-v1" \
            | grep -F '20261015-tg-deeplinks-v1' >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 35 \
            "https://awgcars.ru/auto-sale-vk-notification-navigation.mjs?v=20261015-tg-deeplinks-v1" \
            | grep -F 'resolveManagerNotificationTarget' >/dev/null
          curl --fail --silent --show-error --connect-timeout 10 --max-time 35 \
            "https://awgcars.ru/auto-sale-app-v3.mjs?v=20261015-tg-deeplinks-v1" \
            | grep -F '__AUTO_SALE_OPEN_MANAGER_NOTIFICATION__' >/dev/null
          echo 'AWG_TELEGRAM_HOTFIX_LIVE_FILES_VERIFIED'
      - name: Audit actual Telegram webhook, relay, outbox and start handler
        run: node scripts/audit-awg-telegram-prod-webhook.mjs

