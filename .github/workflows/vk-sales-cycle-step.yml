name: VK Sales Cycle Step

on:
  push:
    branches: [main]
    paths:
      - .diagnostics/vk-sales-cycle-trigger

permissions:
  contents: read
  id-token: write

env:
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  YDB_CONNECTION_STRING: ${{ vars.AWG_YDB_CONNECTION_STRING || 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etn00ojk5iv1u7dgpdar' }}
  AUTO_SALE_TELEGRAM_BOT_TOKEN: ${{ secrets.AWG_TELEGRAM_BOT_TOKEN }}
  AUTO_SALE_MANAGER_CHAT_IDS: ${{ vars.AWG_MANAGER_CHAT_IDS || '' }}
  AUTO_SALE_ADMIN_TELEGRAM_USERNAMES: Flyer_Flyer,smit44744,Ivan_AWG
  AUTO_SALE_TELEGRAM_APP_URL: https://awgcars.ru/
  AUTO_SALE_VK_ENABLED: "true"
  AUTO_SALE_VK_APP_ID: ${{ vars.AWG_VK_APP_ID || '54810434' }}
  AUTO_SALE_VK_APP_SECRET: ${{ secrets.AWG_VK_APP_SECRET }}
  AUTO_SALE_VK_GROUP_ID: ${{ vars.AWG_VK_GROUP_ID || '242103542' }}
  AUTO_SALE_VK_COMMUNITY_TOKEN: ${{ secrets.AWG_VK_COMMUNITY_TOKEN }}

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200"
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Retry original confirmation and move latest VK lead to In Progress
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {AccessTokenCredentialsProvider} from '@ydbjs/auth/access-token';
          import {createYdbDomainStore} from './server/ydb-domain-store.mjs';
          import {createYdbStateStore} from './server/ydb-state.mjs';
          import {mutateAutoSaleEntity} from './server/ydb-entity-commands.mjs';
          import {createTelegramService} from './server/telegram-bot.mjs';
          import {createVkService} from './server/vk.mjs';
          import {managerTelegramUsername} from './shared/auto-sale-manager-directory.mjs';

          const token=String(process.env.YC_IAM_TOKEN||'').trim();
          const connectionString=String(process.env.YDB_CONNECTION_STRING||'').trim();
          if(!token||!connectionString)throw new Error('ydb_credentials_missing');
          const credentialsProvider=new AccessTokenCredentialsProvider({token});
          const domain=await createYdbDomainStore({connectionString,credentialsProvider,ensureSchema:false});
          const runtime=await createYdbStateStore({connectionString,credentialsProvider,ensureSchema:false,domainDualWrite:false});
          const telegram=createTelegramService();
          const vk=createVkService();

          const clean=v=>String(v??'').trim();
          const normalize=v=>clean(v).replace(/^@/,'').toLowerCase();
          const enrich=async state=>{
            const pins=(await runtime.adminAccessList()).filter(x=>/^\d+$/.test(clean(x.telegramUserId)));
            const map=new Map(pins.map(x=>[normalize(x.username),x]));
            const team=(Array.isArray(state.team)?state.team:[]).map(member=>{
              if(/^\d+$/.test(clean(member?.telegramUserId)))return member;
              const username=normalize(member?.telegramUsername||member?.telegram||managerTelegramUsername(member?.name));
              const pin=map.get(username);
              return pin?{...member,telegramUserId:clean(pin.telegramUserId),telegramUsername:username,telegramLinkedAt:clean(pin.linkedAt)}:member;
            });
            return{...state,team};
          };
          const collect=async(previous,next)=>telegram.collectStateChanges(await enrich(previous),await enrich(next));

          async function deliver(items){
            const results=[];
            for(const item of items||[]){
              try{
                const channel=clean(item.channel)||'telegram';
                const sent=channel==='vk'
                  ?await vk.send(item.vkUserId,item.message,{idempotencyKey:item.id})
                  :await telegram.send(item.chatId,item.message,{replyMarkup:item.replyMarkup});
                if(!sent?.message_id)throw new Error(channel==='vk'?'vk_message_id_missing':'telegram_message_id_missing');
                await runtime.markNotification(item.id,{ok:true,messageId:String(sent.message_id),attempts:item.attempts});
                results.push({id:item.id,event:item.event,target:item.target,channel,ok:true,hasMessageId:true});
              }catch(error){
                const message=clean(error?.vkDescription||error?.telegramDescription||error?.message||'notification_send_failed');
                await runtime.markNotification(item.id,{ok:false,error:message,attempts:item.attempts,permanent:Boolean(error?.permanent)});
                results.push({id:item.id,event:item.event,target:item.target,channel:clean(item.channel)||'telegram',ok:false,error:message});
              }
            }
            return results;
          }

          try{
            let state=await domain.loadState();
            const leads=(Array.isArray(state.leads)?state.leads:[])
              .filter(x=>clean(x.clientProvider)==='vk')
              .sort((a,b)=>clean(b.createdAt).localeCompare(clean(a.createdAt)));
            const lead=leads[0];
            if(!lead)throw new Error('no_vk_lead_found');
            console.log('VK_TEST_LEAD',JSON.stringify({id:lead.id,status:lead.status,model:lead.model,source:lead.source}));

            const currentRev=Number(state.revision)||0;
            let confirmation=null;
            for(let revision=Math.max(1,currentRev-10);revision<=currentRev;revision++){
              const rows=await runtime.notificationStatusByRevision(revision);
              confirmation=(rows||[]).find(x=>clean(x.leadId)===clean(lead.id)&&clean(x.event)==='lead_created_confirmation'&&clean(x.target)==='client')||confirmation;
            }
            if(confirmation&&clean(confirmation.status)!=='sent'){
              const pending=await runtime.pendingNotificationsByIds([confirmation.id]);
              const retry=await deliver(pending);
              console.log('ORIGINAL_CONFIRMATION_RETRY',JSON.stringify(retry));
            }else{
              console.log('ORIGINAL_CONFIRMATION',JSON.stringify(confirmation?{status:confirmation.status,attempts:confirmation.attempts,hasMessageId:Boolean(clean(confirmation.messageId))}:{status:'not-found'}));
            }

            state=await domain.loadState();
            const current=(state.leads||[]).find(x=>clean(x.id)===clean(lead.id));
            if(clean(current?.status)==='Новый'){
              const rowVersion=await domain.entityRowVersion('lead',lead.id);
              const result=await mutateAutoSaleEntity({
                legacyStore:runtime,
                domainStore:domain,
                resource:'lead',
                operation:'patch',
                id:lead.id,
                input:{id:lead.id,status:'В работе',nextAction:new Date(Date.now()+86400000).toISOString().slice(0,10)},
                expectedRowVersion:rowVersion,
                prepareNotifications:collect
              });
              if(result.status!==200)throw new Error('lead_patch_failed:'+JSON.stringify(result.data));
              const items=Array.isArray(result.data?._notificationItems)?result.data._notificationItems:[];
              const delivery=await deliver(items);
              console.log('LEAD_PATCH',JSON.stringify({id:lead.id,status:'В работе',revision:result.data.revision,delivery}));
            }else{
              console.log('LEAD_PATCH_SKIPPED',JSON.stringify({id:lead.id,status:current?.status}));
            }
          }finally{
            await Promise.allSettled([domain.close(),runtime.close()]);
          }
          NODE
