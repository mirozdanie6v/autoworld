name: Verify AWG VII-176 Live UI (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-awg-vii176-live-ui.yml

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Install Playwright with system Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/awg-vii176-smoke" --no-package-lock playwright@1.58.2
          command -v google-chrome
      - name: Check live purchase routes and request forms without writing leads
        env:
          AWG_PLAYWRIGHT_DIR: ${{ runner.temp }}/awg-vii176-smoke
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const require=createRequire(path.join(process.env.AWG_PLAYWRIGHT_DIR,'package.json'));
          const {chromium}=require('playwright');
          const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
          const out={};
          try {
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const open=async()=>{
              await page.goto('https://awgcars.ru/',{waitUntil:'domcontentloaded',timeout:50000});
              await page.locator('[data-purchase-origin="США"]').waitFor({timeout:35000});
            };
            await open();
            await page.locator('[data-purchase-origin="США"]').click();
            await page.locator('#originFilter').waitFor({timeout:15000});
            assert.equal(await page.locator('#originFilter').inputValue(),'США');
            out.auctionRoute='OK';
            await open();
            await page.locator('[data-purchase-origin="Грузия"]').click();
            await page.locator('#originFilter').waitFor({timeout:15000});
            assert.equal(await page.locator('#originFilter').inputValue(),'Грузия');
            out.georgiaRoute='OK';
            await open();
            await page.locator('[data-open-request]').first().click();
            const form=page.locator('#requestForm');
            await form.waitFor();
            assert.equal(await form.locator('select[name="ageRange"] option').count(),5);
            assert.equal(await form.locator('[name="yearFrom"],[name="yearTo"],[name="budget"]').count(),0);
            out.genericAgeRange='OK';
            await open();
            const carButton=page.locator('[data-request-car]:not([disabled])').first();
            if(await carButton.count()){
              await carButton.click();
              const carForm=page.locator('#requestForm');
              await carForm.waitFor();
              assert.ok(await carForm.locator('[name="carId"]').inputValue());
              assert.equal(await carForm.locator('[name="year"]').count(),1);
              assert.equal(await carForm.locator('[name="mileage"]').count(),1);
              assert.equal(await carForm.locator('[name="estimatedCostRub"]').count(),1);
              assert.equal(await carForm.locator('[name="ageRange"]').count(),0);
              out.catalogCarRequest='OK';
            }else out.catalogCarRequest='NO_AVAILABLE_CAR_TO_TEST';
            console.log('AWG_VII176_LIVE_UI_READONLY_OK',JSON.stringify(out));
          }finally{await browser.close()}
          NODE
