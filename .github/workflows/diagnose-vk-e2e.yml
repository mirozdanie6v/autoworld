name: Diagnose VK E2E

on:
  push:
    branches: [main]
    paths:
      - .diagnostics/vk-e2e-trigger

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.AWG_YC_FOLDER_ID || 'b1g8u8vqkgehvtbj8n13' }}
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  YC_CONTAINER_NAME: ${{ vars.AWG_YC_CONTAINER_NAME || 'autoworld-awg-prod' }}
  AWG_GATEWAY_NAME: ${{ vars.AWG_GATEWAY_NAME || 'autoworld-awg-prod' }}
  TARGET_REVISION_ID: bba4fdb27ga201p91a5a
  EXPECTED_BUILD_SHA: 391f19ff5e042e05c05b06548b277721b0804272

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200"
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Install and configure Yandex CLI
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 3 https://storage.yandexcloud.net/yandexcloud-yc/install.sh -o /tmp/yc-install.sh
          bash /tmp/yc-install.sh -n
          echo "$HOME/yandex-cloud/bin" >> "$GITHUB_PATH"
          "$HOME/yandex-cloud/bin/yc" config set endpoint api.cloud.yandex.net:443
          "$HOME/yandex-cloud/bin/yc" config set token "$YC_IAM_TOKEN"
          "$HOME/yandex-cloud/bin/yc" config set folder-id "$YC_FOLDER_ID"

      - name: Resolve current production credentials and gateway
        run: |
          set -euo pipefail
          REVISION_JSON=$(yc serverless container revision get "$TARGET_REVISION_ID" --folder-id "$YC_FOLDER_ID" --format json)
          BUILD_SHA=$(printf '%s' "$REVISION_JSON" | jq -r '.environment.AUTO_SALE_BUILD_SHA // empty')
          VK_ENABLED=$(printf '%s' "$REVISION_JSON" | jq -r '.environment.AUTO_SALE_VK_ENABLED // empty')
          API_KEY=$(printf '%s' "$REVISION_JSON" | jq -r '.environment.AUTO_SALE_API_KEY // empty')
          test "$BUILD_SHA" = "$EXPECTED_BUILD_SHA"
          test "$VK_ENABLED" = "true"
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"
          echo "AUTO_SALE_API_KEY=$API_KEY" >> "$GITHUB_ENV"
          GW_JSON=$(yc serverless api-gateway get --name "$AWG_GATEWAY_NAME" --folder-id "$YC_FOLDER_ID" --format json)
          GW_DOMAIN=$(printf '%s' "$GW_JSON" | jq -r '.domain // empty')
          test -n "$GW_DOMAIN"
          echo "AWG_GATEWAY_URL=https://$GW_DOMAIN" >> "$GITHUB_ENV"
          echo "production build=$BUILD_SHA vk=$VK_ENABLED revision=$TARGET_REVISION_ID"

      - name: Diagnose latest VK lead and notification delivery
        run: |
          set -euo pipefail
          URL="${AWG_GATEWAY_URL%/}"
          STATE=$(curl -fsS -H "x-auto-sale-key: $AUTO_SALE_API_KEY" "$URL/api/auto-sale/state")
          HEALTH=$(curl -fsS "$URL/api/health")
          echo "$HEALTH" | jq '{ok,buildSha,vkAuth,vkMessaging,telegramRoutableManagers}'
          LEAD=$(printf '%s' "$STATE" | jq -c '[.leads[]? | select(.clientProvider=="vk")] | sort_by(.createdAt // "") | reverse | .[0] // {}')
          LEAD_ID=$(printf '%s' "$LEAD" | jq -r '.id // empty')
          test -n "$LEAD_ID" || { echo "No VK lead found"; exit 2; }
          printf '%s' "$LEAD" | jq '{
            id,
            createdAt,
            status,
            manager,
            source,
            model,
            clientProvider,
            hasProviderUserId: ((.clientProviderUserId // "")|length>0),
            hasIdentityKey: ((.clientIdentityKey // "")|startswith("vk:")),
            contactLooksVk: ((.contact // "")|test("^https://vk\\.com/"))
          }'
          CURRENT_REV=$(printf '%s' "$STATE" | jq -r '.revision // 0')
          START_REV=$(( CURRENT_REV > 6 ? CURRENT_REV - 6 : 1 ))
          FOUND=0
          for REV in $(seq "$START_REV" "$CURRENT_REV"); do
            DATA=$(curl -fsS -H "x-auto-sale-key: $AUTO_SALE_API_KEY" "$URL/api/auto-sale/notifications/revision?revision=$REV")
            MATCH=$(printf '%s' "$DATA" | jq --arg id "$LEAD_ID" -c '[.deliveries[]? | select(.leadId==$id) | {revision:'"$REV"',event,target,status,error,attempts,hasMessageId:((.messageId // "")|length>0)}]')
            COUNT=$(printf '%s' "$MATCH" | jq 'length')
            if [ "$COUNT" -gt 0 ]; then
              FOUND=1
              printf '%s' "$MATCH" | jq .
            fi
          done
          if [ "$FOUND" -eq 0 ]; then
            echo "No notification records found for latest VK lead in recent revisions"
            exit 3
          fi
