name: Diagnose VK E2E

on:
  push:
    branches: [main]
    paths:
      - .diagnostics/vk-e2e-trigger

permissions:
  contents: read
  id-token: write

env:
  YC_FOLDER_ID: ${{ vars.AWG_YC_FOLDER_ID || 'b1g8u8vqkgehvtbj8n13' }}
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  YDB_CONNECTION_STRING: ${{ vars.AWG_YDB_CONNECTION_STRING || 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etn00ojk5iv1u7dgpdar' }}
  AWG_GATEWAY_URL: https://d5dbgio6limv03usvipl.s183zexc.apigw.yandexcloud.net
  EXPECTED_BUILD_SHA: 391f19ff5e042e05c05b06548b277721b0804272

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install locked dependencies
        run: npm ci

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200"
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Verify production health
        run: |
          set -euo pipefail
          HEALTH=$(curl -fsS "${AWG_GATEWAY_URL%/}/api/health")
          echo "$HEALTH" | jq '{ok,buildSha,vkAuth,vkMessaging,telegramRoutableManagers}'
          echo "$HEALTH" | jq -e --arg sha "$EXPECTED_BUILD_SHA" '.ok==true and .buildSha==$sha and .vkAuth=="enabled" and .vkMessaging=="enabled"' >/dev/null

      - name: Diagnose latest VK lead and notifications from YDB
        env:
          YDB_ACCESS_TOKEN_CREDENTIALS: ${{ env.YC_IAM_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {AccessTokenCredentialsProvider} from '@ydbjs/auth/access-token';
          import {createYdbDomainStore} from './server/ydb-domain-store.mjs';
          import {createYdbStateStore} from './server/ydb-state.mjs';

          const token=String(process.env.YC_IAM_TOKEN||process.env.YDB_ACCESS_TOKEN_CREDENTIALS||'').trim();
          const connectionString=String(process.env.YDB_CONNECTION_STRING||'').trim();
          if(!token||!connectionString)throw new Error('diagnostic_ydb_credentials_missing');
          const credentialsProvider=new AccessTokenCredentialsProvider({token});
          const domain=await createYdbDomainStore({connectionString,credentialsProvider,ensureSchema:false});
          const runtime=await createYdbStateStore({connectionString,credentialsProvider,ensureSchema:false,domainDualWrite:false});
          try{
            const state=await domain.loadState();
            const leads=(Array.isArray(state.leads)?state.leads:[])
              .filter(item=>String(item?.clientProvider||'')==='vk')
              .sort((a,b)=>String(b?.createdAt||'').localeCompare(String(a?.createdAt||'')));
            const lead=leads[0];
            if(!lead)throw new Error('no_vk_lead_found');
            console.log('VK_LEAD',JSON.stringify({
              id:String(lead.id||''),
              createdAt:String(lead.createdAt||''),
              status:String(lead.status||''),
              manager:String(lead.manager||''),
              source:String(lead.source||''),
              model:String(lead.model||''),
              clientProvider:String(lead.clientProvider||''),
              hasProviderUserId:Boolean(String(lead.clientProviderUserId||'')),
              hasIdentityKey:String(lead.clientIdentityKey||'').startsWith('vk:'),
              contactLooksVk:/^https:\/\/vk\.com\//.test(String(lead.contact||''))
            }));
            const current=Number(state.revision)||0;
            const start=Math.max(1,current-10);
            const deliveries=[];
            for(let revision=start;revision<=current;revision++){
              const rows=await runtime.notificationStatusByRevision(revision);
              for(const row of rows||[]){
                if(String(row.leadId||'')!==String(lead.id||''))continue;
                deliveries.push({
                  revision,
                  event:String(row.event||''),
                  target:String(row.target||''),
                  status:String(row.status||''),
                  error:String(row.error||''),
                  attempts:Number(row.attempts||0),
                  hasMessageId:Boolean(String(row.messageId||''))
                });
              }
            }
            console.log('VK_DELIVERIES',JSON.stringify(deliveries));
            if(!deliveries.length)throw new Error('no_vk_notification_records_found');
          }finally{
            await Promise.allSettled([domain.close(),runtime.close()]);
          }
          NODE
