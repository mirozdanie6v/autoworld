name: Probe AutoWorld Yandex OIDC

on:
  push:
    branches: [main]
    paths:
      - .production/oidc-probe

permissions:
  contents: read
  id-token: write

env:
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Validate OIDC target
        run: test -n "$YC_DEPLOY_SA_ID"

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Report non-secret OIDC claims
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          node <<'NODE'
          const token = process.env.GITHUB_OIDC_TOKEN || ''
          const payload = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8'))
          const keys = ['iss','aud','sub','repository','repository_id','repository_owner','repository_owner_id','ref','workflow_ref']
          const safe = Object.fromEntries(keys.filter(k => payload[k] !== undefined).map(k => [k, payload[k]]))
          console.log(JSON.stringify(safe))
          NODE

      - name: Verify Yandex workload identity trust
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOY_SA_ID" \
            --data-urlencode "subject_token=$GITHUB_OIDC_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" != "200" ]; then
            echo "AutoWorld canonical repository is not trusted by Yandex workload identity (HTTP $HTTP_CODE)"
            echo "$BODY" | jq -c '{error,error_description}' || true
            exit 1
          fi
          TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "Yandex OIDC trust verified for mirozdanie6v/autoworld main"
