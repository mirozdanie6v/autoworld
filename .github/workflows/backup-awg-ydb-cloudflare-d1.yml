name: AWG encrypted YDB backups to Cloudflare D1

on:
  schedule:
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Backup current YDB, verify most recent, or list encrypted snapshots'
        required: true
        type: choice
        default: backup
        options:
          - backup
          - verify-latest
          - list
      create_database:
        description: 'Initial setup only: create the dedicated Cloudflare D1 archive if absent'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: awg-cloudflare-d1-backup-writer
  cancel-in-progress: false

env:
  YC_FOLDER_ID: b1g8u8vqkgehvtbj8n13
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etn00ojk5iv1u7dgpdar
  CLOUDFLARE_ACCOUNT_ID: f4935962036fd500d34335e0b174b227

jobs:
  backup:
    # Scheduled jobs are deliberately dormant until the two independent
    # secrets have been configured and the operator enables this variable.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AWG_CF_D1_BACKUP_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWG_CF_D1_BACKUP_TOKEN: ${{ secrets.AWG_CF_D1_BACKUP_TOKEN }}
      AWG_BACKUP_ENCRYPTION_KEY: ${{ secrets.AWG_BACKUP_ENCRYPTION_KEY }}
      AWG_CF_D1_ALLOW_CREATE: ${{ github.event_name == 'workflow_dispatch' && inputs.create_database && 'yes' || 'no' }}
      AWG_CF_D1_BOOTSTRAP_GUARD: ${{ github.event_name == 'workflow_dispatch' && inputs.create_database && 'AWG_D1_CREATE_ONLY_20261015' || '' }}
      BACKUP_OPERATION: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'backup' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Require independent Cloudflare D1 and encryption secrets
        run: |
          set -euo pipefail
          test -n "$AWG_CF_D1_BACKUP_TOKEN" || { echo "::error::Add GitHub Actions secret AWG_CF_D1_BACKUP_TOKEN (Cloudflare D1 Edit for one account)"; exit 1; }
          test -n "$AWG_BACKUP_ENCRYPTION_KEY" || { echo "::error::Add GitHub Actions secret AWG_BACKUP_ENCRYPTION_KEY (random 32-byte base64 key)"; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = f4935962036fd500d34335e0b174b227
          test "$YDB_CONNECTION_STRING" = 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etn00ojk5iv1u7dgpdar'
          echo "::add-mask::$AWG_CF_D1_BACKUP_TOKEN"
          echo "::add-mask::$AWG_BACKUP_ENCRYPTION_KEY"
      - name: Install locked dependency tree and run encrypted backup unit tests
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          node --test tests/auto-sale-cloudflare-d1-backup.test.mjs
          node --check scripts/backup-awg-ydb-cloudflare-d1.mjs
      - name: Request existing GitHub OIDC Yandex identity
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token=await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token',token)
      - name: Exchange Yandex identity for short-lived IAM access token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOY_SA_ID" \
            --data-urlencode "subject_token=$GITHUB_OIDC_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          TOKEN=$(printf '%s' "$RESPONSE" | jq -er '.access_token')
          echo "::add-mask::$TOKEN"
          echo "YDB_ACCESS_TOKEN_CREDENTIALS=$TOKEN" >> "$GITHUB_ENV"
      - name: Export consistent YDB snapshot, encrypt, store and verify in Cloudflare D1
        run: |
          set -euo pipefail
          node scripts/backup-awg-ydb-cloudflare-d1.mjs "$BACKUP_OPERATION"
          echo "AWG_BACKUP_OPERATION_COMPLETE=$BACKUP_OPERATION"
