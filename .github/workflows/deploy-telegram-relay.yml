name: Deploy Telegram relay to Cloudflare
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install and test
        working-directory: cloudflare/telegram-relay
        run: npm install && npm test
      - name: Deploy Worker
        working-directory: cloudflare/telegram-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.toml
      - name: Configure Telegram secret
        working-directory: cloudflare/telegram-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.AWG_TELEGRAM_BOT_TOKEN }}
          AUTOWORLD_RELAY_SECRET: ${{ secrets.AWG_RELAY_SECRET }}
          YANDEX_WEBHOOK_BASE: ${{ vars.AWG_YANDEX_WEBHOOK_BASE_URL || 'https://bba01u6g86lg2q49p34d.containers.yandexcloud.net' }}
        run: |
          test -n "$TELEGRAM_BOT_TOKEN" || { echo "Missing AWG_TELEGRAM_BOT_TOKEN"; exit 1; }
          test -n "$AUTOWORLD_RELAY_SECRET" || { echo "Missing AWG_RELAY_SECRET"; exit 1; }
          printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN --config wrangler.toml
          printf '%s' "$AUTOWORLD_RELAY_SECRET" | npx wrangler secret put AUTOWORLD_RELAY_SECRET --config wrangler.toml
          WEBHOOK_KEY=$(node -e "const {createHmac}=require('crypto');process.stdout.write(createHmac('sha256',process.env.TELEGRAM_BOT_TOKEN).update('auto-sale-telegram-webhook-v2').digest('hex').slice(0,32))")
          printf '%s' "$YANDEX_WEBHOOK_BASE/api/auto-sale/telegram/webhook/$WEBHOOK_KEY" | npx wrangler secret put AUTOWORLD_YANDEX_WEBHOOK_URL --config wrangler.toml
      - name: Verify relay
        run: curl --fail --silent --show-error https://integration-telegram.viiversion.com/telegram/health
