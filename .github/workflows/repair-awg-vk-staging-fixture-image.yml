name: Repair isolated VK staging synthetic car photo
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-awg-vk-staging-fixture-image.yml
permissions:
  contents: read
  id-token: write
concurrency:
  group: awg-vk-staging-ydb-schema
  cancel-in-progress: false
env:
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnhujtu1t6f89tdtohs
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Verify isolated target and dependencies
        run: |
          set -euo pipefail
          test "$YDB_CONNECTION_STRING" = 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnhujtu1t6f89tdtohs'
          echo "Target staging database: etnhujtu1t6f89tdtohs"
          npm ci
      - name: Obtain short-lived GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Exchange token for Yandex IAM
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS --connect-timeout 10 --max-time 30 -w '\n%{http_code}' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOY_SA_ID" \
            --data-urlencode "subject_token=$GITHUB_OIDC_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          test "$CODE" = 200 || { echo "::error::Yandex OIDC exchange failed (HTTP $CODE)"; exit 1; }
          TOKEN=$(printf '%s' "$RESPONSE" | sed '$d' | jq -r '.access_token // empty')
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          echo "YDB_ACCESS_TOKEN_CREDENTIALS=$TOKEN" >> "$GITHUB_ENV"
      - name: Repair only synthetic staging car image
        run: |
          set -euo pipefail
          test "$YDB_CONNECTION_STRING" = 'grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnhujtu1t6f89tdtohs'
          node --check scripts/repair-awg-vk-staging-fixture-image.mjs
          node scripts/repair-awg-vk-staging-fixture-image.mjs
          echo 'One invalid staging-only fixture image repaired through revision-checked normalized writer; production unchanged.' >> "$GITHUB_STEP_SUMMARY"
