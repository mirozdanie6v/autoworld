name: Clear AUTO SALE CRM for customer demo

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  YC_DEPLOY_SA_ID: ${{ vars.YC_DEPLOY_SA_ID }}
  YDB_CONNECTION_STRING: ${{ vars.YDB_CONNECTION_STRING }}

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Request GitHub OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Exchange OIDC token for Yandex IAM token
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -w '\n%{http_code}' -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=${YC_DEPLOY_SA_ID}" \
            --data-urlencode "subject_token=${GITHUB_OIDC_TOKEN}" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          HTTP_CODE=$(printf '%s' "$RESPONSE" | tail -n1)
          BODY=$(printf '%s' "$RESPONSE" | sed '$d')
          test "$HTTP_CODE" = "200"
          IAM_TOKEN=$(printf '%s' "$BODY" | jq -r '.access_token')
          test -n "$IAM_TOKEN" && test "$IAM_TOKEN" != "null"
          echo "::add-mask::$IAM_TOKEN"
          echo "YC_IAM_TOKEN=$IAM_TOKEN" >> "$GITHUB_ENV"

      - name: Clear CRM and notification outbox
        run: |
          set -euo pipefail
          export YDB_ACCESS_TOKEN_CREDENTIALS="$YC_IAM_TOKEN"
          node scripts/clear-auto-sale-demo-data.mjs

      - name: Verify cleanup report
        run: |
          jq -e '.ok == true
            and .after.leads == 0
            and .after.quotes == 0
            and .after.orders == 0
            and .after.notes == 0
            and .after.payments == 0
            and .after.outbox == 0
            and ((.after.telegramBindingTypes.client // 0) == 0)
            and .preserved.team == true
            and .preserved.catalog == true
            and .preserved.adminAccess == true' auto-sale-demo-cleanup-report.json >/dev/null
          cat auto-sale-demo-cleanup-report.json

      - name: Upload cleanup report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-sale-demo-cleanup-report
          path: auto-sale-demo-cleanup-report.json
          if-no-files-found: error
