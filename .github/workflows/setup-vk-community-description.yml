name: Setup VK Community Description
on:
  push:
    branches: [feat/vk-community-branding-20261008]
    paths:
      - .github/workflows/setup-vk-community-description.yml
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GROUP_ID: "242103542"
      TOKEN: ${{ secrets.AWG_VK_COMMUNITY_TOKEN }}
    steps:
      - name: Write description only if blank
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const description="AUTO МИР | AutoWorld Georgia — подбор, выкуп и поставка автомобилей из США и Грузии.\n\nВыбирайте автомобиль из каталога или оставляйте заявку на индивидуальный подбор. Мы поможем разобраться в вариантах, рассчитать ориентировочную стоимость и обсудить этапы покупки и доставки.\n\nЧто доступно:\n• Каталог автомобилей с фотографиями и характеристиками.\n• Расчёт стоимости покупки.\n• Заявка на автомобиль или индивидуальный подбор.\n• Связь с менеджерами и информация по этапам сделки.\n\nПрозрачный подход к покупке: понятный расчёт, детали автомобиля и сопровождение от первого обращения.\n\nКаталог и заявки: https://www.awgcars.ru/";
          const token=process.env.TOKEN,group=process.env.GROUP_ID,version='5.199';
          if(!token)throw new Error('missing_community_token');
          async function api(method,params={}){
            const body=new URLSearchParams({...params,access_token:token,v:version});
            const response=await fetch('https://api.vk.com/method/'+method,{method:'POST',headers:{'content-type':'application/x-www-form-urlencoded'},body,signal:AbortSignal.timeout(15000)});
            const data=await response.json();
            if(data.error)throw new Error(method+': code='+data.error.error_code+' '+String(data.error.error_msg||''));
            return data.response;
          }
          function pick(response){return response?.groups?.[0]||response?.[0]||response?.group||{}}
          const current=pick(await api('groups.getById',{group_ids:group,fields:'description,site,status,cover'}));
          if(String(current.id)!==group)throw new Error('group_id_mismatch');
          if(String(current.description||'').trim()){
            console.log(JSON.stringify({changed:false,reason:'description_already_present',length:current.description.length}));
          }else{
            await api('groups.edit',{group_id:group,description});
            const updated=pick(await api('groups.getById',{group_ids:group,fields:'description'}));
            if(updated.description!==description)throw new Error('description_verification_failed');
            console.log(JSON.stringify({changed:true,verified:true,group_id:group,description_length:description.length}));
          }
          NODE
