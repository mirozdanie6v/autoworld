name: Prepare AWG Timeweb staging

on:
  workflow_dispatch:
    inputs:
      create_server:
        description: Create the isolated 1 CPU / 2 GB staging server (base tariff capped at 1940 RUB/month; IPv4 and storage are extra)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: awg-timeweb-staging-provision
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
      CREATE_SERVER: ${{ inputs.create_server }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Load verified public SSH key from the encrypted Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-awg-timeweb-ssh-key.sh
      - name: Inspect account and prepare staging
        env:
          AWG_TIMEWEB_PLAN_OUTPUT: ${{ runner.temp }}/timeweb-staging-plan.json
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$CREATE_SERVER" = "true" ]; then args+=(--create); fi
          node scripts/prepare-awg-timeweb.mjs "${args[@]}"
      - name: Save sanitized infrastructure report
        uses: actions/upload-artifact@v4
        with:
          name: awg-timeweb-staging-plan
          path: ${{ runner.temp }}/timeweb-staging-plan.json
          retention-days: 7
          if-no-files-found: error
