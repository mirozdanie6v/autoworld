name: Diagnose AWG Health

on:
  push:
    paths:
      - .github/workflows/diagnose-awg-health.yml

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Read public AWG health
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 -fsS             https://d5dbgio6limv03usvipl.s183zexc.apigw.yandexcloud.net/api/health             | tee /tmp/health.json             | jq .
