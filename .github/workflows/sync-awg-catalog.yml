name: Sync AWG catalog from AutoWorld Georgia

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .sync-awg-catalog
      - .sync-awg-catalog-price-reconcile
      - scripts/prepare-awg-price-safe-import.mjs

permissions:
  contents: read
  id-token: write

concurrency:
  group: awg-catalog-sync
  cancel-in-progress: false

env:
  AWG_URL: https://awgcars.ru
  AWG_CATALOG_IMPORT_URL: https://awgcars.ru/api/auto-sale/admin/catalog-import
  AWG_MEDIA_API: https://awgcars.ru/api/auto-sale/media

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout canonical AutoWorld
        uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select controlled catalog operation
        id: mode
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          with open(os.environ['GITHUB_EVENT_PATH'],encoding='utf8') as fp:
              event=json.load(fp)
          import subprocess
          head=event.get('head_commit') or {}
          changed=set(head.get('modified') or []) | set(head.get('added') or [])
          # GitHub's push webhook may omit per-commit file lists for Contents API
          # commits. The checked-out commit's tree is the authoritative fallback.
          commit_files=subprocess.check_output(
              ['git','show','--pretty=format:','--name-only','HEAD'],
              text=True
          ).splitlines()
          changed.update(file.strip() for file in commit_files if file.strip())
          price=(os.environ.get('GITHUB_EVENT_NAME')=='push'
                 and '.sync-awg-catalog-price-reconcile' in changed)
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf8') as fp:
              fp.write('price='+('true' if price else 'false')+'\n')
          print('AWG_CATALOG_WORKFLOW_MODE', 'price-reconcile' if price else 'scheduled-import')
          PY

      - name: Install scraper dependencies
        if: steps.mode.outputs.price != 'true'
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Request canonical catalog OIDC token
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('autoworld-catalog-import')
            core.setSecret(token)
            core.setOutput('token', token)

      - name: Export catalog OIDC token
        env:
          CATALOG_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          test -n "$CATALOG_OIDC_TOKEN"
          echo "::add-mask::$CATALOG_OIDC_TOKEN"
          echo "AUTO_SALE_CATALOG_IMPORT_BEARER=$CATALOG_OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Seed current production media index
        run: |
          set -euo pipefail
          mkdir -p /tmp/awg-import
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS \
            "$AWG_URL/api/auto-sale/state" \
            | jq '[.catalog[]? | select(.source == "AutoWorld_Georgia")]' \
            > /tmp/awg-import/cars.json
          test "$(jq 'length' /tmp/awg-import/cars.json)" -ge 100
          cp /tmp/awg-import/cars.json /tmp/awg-import/live-catalog.json

      - name: Scrape recent AutoWorld Georgia posts
        if: steps.mode.outputs.price != 'true'
        env:
          OUT_DIR: /tmp/awg-import
          MAX_PAGES: '20'
          REQUEST_DELAY: '0.30'
          UPLOAD_MISSING_PHOTOS: 'true'
          MERGE_EXISTING: 'false'
          AUTO_SALE_MEDIA_API: https://awgcars.ru/api/auto-sale/media
        run: python scripts/scrape-autoworld-georgia.py

      - name: Normalize recent posts
        if: steps.mode.outputs.price != 'true'
        env:
          SOURCE_PATH: /tmp/awg-import/cars.json
          OUTPUT_PATH: /tmp/awg-catalog-normalized.json
          AUDIT_PATH: /tmp/awg-catalog-import-audit.json
          DRY_RUN: 'true'
        run: node scripts/import-autoworld-catalog.mjs

      - name: Reconcile all fresh source prices without replacing existing VINs or media
        if: steps.mode.outputs.price != 'true'
        env:
          SOURCE_PATH: /tmp/awg-import/cars.json
          LIVE_PATH: /tmp/awg-import/live-catalog.json
          NORMALIZED_PATH: /tmp/awg-catalog-normalized.json
          OUTPUT_PATH: /tmp/awg-catalog-import.json
          REPORT_PATH: /tmp/awg-import/price-sync-report.json
        run: node scripts/prepare-awg-price-safe-import.mjs

      - name: Upsert recent catalog entities
        if: steps.mode.outputs.price != 'true'
        env:
          AUTO_SALE_CATALOG_IMPORT_URL: https://awgcars.ru/api/auto-sale/admin/catalog-import
          SOURCE_PATH: /tmp/awg-catalog-import.json
          REPLACE_SOURCE_ALL: 'false'
        run: |
          if [ "$(jq length /tmp/awg-catalog-import.json)" -eq 0 ]; then
            echo 'AWG_CATALOG_NO_CHANGES'; exit 0
          fi
          node scripts/sync-autoworld-catalog.mjs

      - name: Verify public RU catalog
        if: steps.mode.outputs.price != 'true'
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 -fsS \
            "$AWG_URL/api/auto-sale/state" > /tmp/awg-state.json
          COUNT=$(jq '[.catalog[]? | select(.source == "AutoWorld_Georgia" and .active != false)] | length' /tmp/awg-state.json)
          LATEST=$(jq -r '[.catalog[]? | select(.source == "AutoWorld_Georgia") | (.sourcePostId|tonumber? // 0)] | max // 0' /tmp/awg-state.json)
          NORMALIZED=$(jq 'length' /tmp/awg-catalog-import.json)
          SKIPPED=$(jq '.skippedInvalidCount // 0' /tmp/awg-catalog-import-audit.json)
          DUPLICATES=$(jq '.duplicateVinCount // 0' /tmp/awg-catalog-import-audit.json)
          echo "AWG catalog count: $COUNT"
          echo "Latest source post: $LATEST"
          echo "Normalized recent cars: $NORMALIZED"
          echo "Skipped invalid recent posts: $SKIPPED"
          echo "Duplicate VIN candidates: $DUPLICATES"
          test "$COUNT" -ge 100
          test "$LATEST" -gt 0
          {
            echo "## AWG catalog sync"
            echo
            echo "- Canonical repo: mirozdanie6v/autoworld"
            echo "- Production domain: https://awgcars.ru"
            echo "- Active AutoWorld_Georgia cars: $COUNT"
            echo "- Latest source post: $LATEST"
            echo "- Recent normalized cars: $NORMALIZED"
            echo "- Skipped invalid posts: $SKIPPED"
            echo "- Duplicate VIN candidates: $DUPLICATES"
            echo "- Source: @AutoWorld_Georgia"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify corrected pricing, immutable catalog IDs and preserved source photos
        if: steps.mode.outputs.price != 'true'
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const before=JSON.parse(readFileSync('/tmp/awg-import/live-catalog.json','utf8'));
          const state=JSON.parse(readFileSync('/tmp/awg-state.json','utf8'));
          const report=JSON.parse(readFileSync('/tmp/awg-import/price-sync-report.json','utf8'));
          const older=new Map(before.map(c=>[String(c.id),c]));
          const after=new Map((state.catalog||[]).map(c=>[String(c.id),c]));
          for(const c of report.changes){
            const previous=older.get(c.id),next=after.get(c.id);
            if(!previous||!next)throw Error('catalog_id_missing_'+c.id);
            for(const k of ['id','sourcePostId','vin']){
              if(String(previous[k]??'')!==String(next[k]??''))throw Error('catalog_identity_changed_'+c.id+'_'+k);
            }
            if(previous.active===false&&next.active!==false)throw Error('hidden_car_reactivated_'+c.id);
            for(const k of ['image','otherPhotos','photos']){
              if(JSON.stringify(previous[k]??null)!==JSON.stringify(next[k]??null))
                throw Error('source_media_changed_'+c.id+'_'+k);
            }
            if(Number(next.priceRub)!==c.nextPriceRub||Number(next.russiaTurnkeyRub||0)!==c.nextTurnkeyRub)
              throw Error('price_reconciliation_failed_'+c.id);
          }
          console.log('AWG_PRICE_SYNC_VERIFIED',JSON.stringify({checked:report.changes.length,
            created:report.newCars,sourceCars:[...after.values()].filter(c=>c.source==='AutoWorld_Georgia').length}));
          JS
      - name: Audit archived sticker prices against canonical production
        if: steps.mode.outputs.price == 'true'
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          LIVE_PATH: /tmp/awg-import/cars.json
          REPORT_PATH: /tmp/awg-price-repair/report.json
          DELTA_PATH: /tmp/awg-price-repair/corrections.json
        run: |
          set -euo pipefail
          node scripts/audit-awg-catalog-price-reconciliation.mjs
          jq -r '"CATALOG_PRICE_RECONCILE candidates=\(.candidates) repair_missing=\(.missingPricesCorrectable) correct_price=\(.existingPricesCorrectable) secondary=\(.secondaryPriceCorrections) unresolved=\(.unresolvedCount)"' /tmp/awg-price-repair/report.json
      - name: Reimport vetted existing-car pricing via canonical trusted workflow
        if: steps.mode.outputs.price == 'true'
        env:
          SOURCE_PATH: /tmp/awg-price-repair/corrections.json
          REPLACE_SOURCE_ALL: 'false'
        run: |
          set -euo pipefail
          MODE=$(sed -n 's/^mode=//p' .sync-awg-catalog-price-reconcile | tail -n1)
          test "$MODE" = 'apply'
          COUNT=$(jq 'length' "$SOURCE_PATH")
          if [ "$COUNT" -eq 0 ]; then echo 'CATALOG_PRICE_REIMPORT_NO_CHANGE'; exit 0; fi
          test "$COUNT" -le 180
          node scripts/sync-autoworld-catalog.mjs
      - name: Confirm targeted prices, catalog integrity and manual deactivations
        if: steps.mode.outputs.price == 'true'
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -fsS \
            "$AWG_URL/api/auto-sale/state" \
            | jq '[.catalog[]? | select(.source == "AutoWorld_Georgia")]' \
            > /tmp/awg-price-repair/after.json
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const prior=JSON.parse(readFileSync('/tmp/awg-import/cars.json','utf8'));
          const after=JSON.parse(readFileSync('/tmp/awg-price-repair/after.json','utf8'));
          const requested=JSON.parse(readFileSync('/tmp/awg-price-repair/corrections.json','utf8'));
          const prev=new Map(prior.map(x=>[x.id,x]));
          const now=new Map(after.map(x=>[x.id,x]));
          if(after.length<prior.length)throw Error('catalog_shrank');
          for(const car of requested){
            const old=prev.get(car.id),next=now.get(car.id);
            if(!old||!next)throw Error('car_missing_'+car.id);
            if(Number(next.priceRub)!==Number(car.priceRub))throw Error('price_mismatch_'+car.id);
            // A legacy turnkey-only listing still has purchase price 0; verify
            // its actual Russia-with-repair amount and any range/route metadata.
            for(const field of ['russiaTurnkeyRub','russiaTurnkeyMaxRub','russiaTurnkeyKind',
              'usaTurnkeyRub','georgiaTurnkeyRub','catalogPriceEvidence']){
              if(Object.hasOwn(car,field)&&String(next[field]??(typeof car[field]==='number'?0:''))!==String(car[field]))
                throw Error('source_price_metadata_mismatch_'+car.id+'_'+field);
            }
            if(old.active===false&&next.active!==false)throw Error('hidden_car_reactivated_'+car.id);
            if(next.sourcePostId!==old.sourcePostId)throw Error('source_identity_changed_'+car.id);
          }
          console.log('CATALOG_PRICE_REIMPORT_VERIFIED',JSON.stringify({updated:requested.length,count:after.length}));
          JS
      - name: Attach price-only reconciliation audit
        if: always() && steps.mode.outputs.price == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: awg-catalog-source-price-reconcile
          path: |
            /tmp/awg-price-repair/report.json
            /tmp/awg-price-repair/corrections.json
          if-no-files-found: ignore

      - name: Upload import audit
        if: always() && steps.mode.outputs.price != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: awg-catalog-import-audit
          path: |
            /tmp/awg-catalog-import-audit.json
            /tmp/awg-import/report.json
            /tmp/awg-import/price-sync-report.json
          if-no-files-found: ignore
