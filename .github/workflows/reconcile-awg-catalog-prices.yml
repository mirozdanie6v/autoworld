name: Audit AWG catalog source prices (read only)

on:
  pull_request:
    paths:
      - scripts/catalog-source-price.mjs
      - scripts/scrape-autoworld-georgia.py
      - scripts/import-autoworld-catalog.mjs
      - scripts/audit-awg-catalog-price-reconciliation.mjs
      - scripts/audit-awg-current-price-drift.mjs
      - tests/auto-sale-catalog-source-prices.test.mjs
      - .github/workflows/reconcile-awg-catalog-prices.yml

permissions:
  contents: read
  id-token: none

concurrency:
  group: awg-catalog-sync
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Collect production catalog (read only)
        run: |
          set -euo pipefail
          mkdir -p /tmp/awg-price-audit
          curl --retry 5 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 40 -fsS \
            https://awgcars.ru/api/auto-sale/state \
            | jq '[.catalog[]? | select(.source == "AutoWorld_Georgia")]' \
            > /tmp/awg-price-audit/live-catalog.json
          COUNT=$(jq 'length' /tmp/awg-price-audit/live-catalog.json)
          test "$COUNT" -ge 100
          echo "PRODUCTION_CATALOG_READ_OK source_count=$COUNT"
      - name: Audit all archived channel prices against live catalog (read only)
        env:
          SOURCE_PATH: data/autoworld-georgia/cars.json
          LIVE_PATH: /tmp/awg-price-audit/live-catalog.json
          REPORT_PATH: /tmp/awg-price-audit/report.json
          DELTA_PATH: /tmp/awg-price-audit/corrections.json
        run: |
          node scripts/audit-awg-catalog-price-reconciliation.mjs
          jq -r '"PRICE_RECONCILE candidates=\(.candidates) unresolved=\(.unresolvedCount) currently_unpriced=\(.liveUnpriced)"' \
            /tmp/awg-price-audit/report.json
      - name: Install read-only Telegram source scraper
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Scrape recent Telegram source posts without media upload
        env:
          OUT_DIR: /tmp/awg-price-audit/recent
          MAX_PAGES: '20'
          REQUEST_DELAY: '0.30'
          UPLOAD_MISSING_PHOTOS: 'false'
          MERGE_EXISTING: 'false'
        run: python scripts/scrape-autoworld-georgia.py
      - name: Compare archive and fresh Telegram listing prices against live catalog (read only)
        env:
          ARCHIVE_PATH: data/autoworld-georgia/cars.json
          RECENT_PATH: /tmp/awg-price-audit/recent/cars.json
          LIVE_PATH: /tmp/awg-price-audit/live-catalog.json
          REPORT_PATH: /tmp/awg-price-audit/live-price-drift.json
          CSV_PATH: /tmp/awg-price-audit/live-price-drift.csv
        run: node scripts/audit-awg-current-price-drift.mjs
      - name: Upload inspectable catalog pricing audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awg-price-catalog-reconciliation
          path: |
            /tmp/awg-price-audit/report.json
            /tmp/awg-price-audit/corrections.json
            /tmp/awg-price-audit/live-price-drift.json
            /tmp/awg-price-audit/live-price-drift.csv
          if-no-files-found: ignore
