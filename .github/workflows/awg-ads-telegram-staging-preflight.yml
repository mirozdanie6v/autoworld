name: AWG Ads Telegram staging deploy
on:
  push:
    branches: [feature/awg-ads-stage-b-integration]
    paths:
      - .github/workflows/awg-ads-telegram-staging-preflight.yml
      - scripts/deploy-awg-ads-telegram-staging.mjs
      - server/telegram-bot.mjs
      - server/yandex-server.mjs
      - server/ads-client-submission-context.mjs
      - tests/awg-ads-client-submission-context.test.mjs
      - tests/awg-ads-stage-b.test.mjs
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: awg-ads-telegram-staging-preflight
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: awg-ads-staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify dedicated bot and inspect staging deployment access
        uses: actions/github-script@v7
        env:
          BOT_TOKEN: ${{ secrets.AWG_ADS_STAGING_TELEGRAM_BOT_TOKEN }}
        with:
          script: |
            if(context.repo.owner!=='mirozdanie6v'||context.repo.repo!=='autoworld'||context.ref!=='refs/heads/feature/awg-ads-stage-b-integration')throw Error('unapproved repository/ref');
            const token=process.env.BOT_TOKEN;
            if(!token)throw Error('missing dedicated staging bot secret');
            core.setSecret(token);
            async function telegram(method){
              let r;try{r=await fetch('https://api.telegram.org/bot'+token+'/'+method,{method:'POST',signal:AbortSignal.timeout(25000)});}catch{throw Error('Telegram '+method+' transport unavailable');}
              if(!r.ok)throw Error('Telegram '+method+' HTTP '+r.status);
              const j=await r.json();if(!j.ok)throw Error('Telegram '+method+' rejected');return j.result;
            }
            const me=await telegram('getMe');
            if(me.id!==8824530254||me.username!=='auto_sale_usa_bot'||!me.is_bot)throw Error('dedicated bot identity mismatch');
            core.info('Dedicated Telegram bot identity verified: @'+me.username+' ID '+me.id);
            const hook=await telegram('getWebhookInfo');
            core.info('Existing staging webhook configured='+Boolean(hook.url)+'; pending updates='+hook.pending_update_count);
            const jwt=await core.getIDToken('https://github.com/mirozdanie6v');core.setSecret(jwt);
            const c=JSON.parse(Buffer.from(jwt.split('.')[1],'base64url'));
            if(c.sub!=='repo:mirozdanie6v@49186663/autoworld@1398349654:environment:awg-ads-staging')throw Error('unexpected OIDC subject');
            const r=await fetch('https://auth.yandex.cloud/oauth/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({grant_type:'urn:ietf:params:oauth:grant-type:token-exchange',requested_token_type:'urn:ietf:params:oauth:token-type:access_token',audience:'aje3j5aat66lel86cd5r',subject_token:jwt,subject_token_type:'urn:ietf:params:oauth:token-type:id_token'}),signal:AbortSignal.timeout(25000)});
            if(!r.ok)throw Error('staging IAM HTTP '+r.status);
            const iam=(await r.json()).access_token;if(!iam)throw Error('missing IAM');core.setSecret(iam);core.exportVariable('YC_IAM_TOKEN',iam);
            for(const [label,url] of [
              ['container','https://serverless-containers.api.cloud.yandex.net/containers/v1/containers/bba5hanjiq9ngu77i8p9'],
              ['registry','https://container-registry.api.cloud.yandex.net/container-registry/v1/registries/crpkirscqc5gt6dgeujr']]){
              const probe=await fetch(url,{headers:{Authorization:'Bearer '+iam},signal:AbortSignal.timeout(25000)});
              core.info('Staging read-only '+label+' inventory HTTP '+probe.status);
              if(!probe.ok)throw Error('staging '+label+' access denied');
              const j=await probe.json();
              if(j.folderId!=='b1g8u8vqkgehvtbj8n13'||(label==='container'&&j.name!=='autoworld-ads-telegram-staging'))throw Error('staging target mismatch');
            }
            await core.summary.addHeading('Dedicated Telegram bot preflight').addRaw('Bot identity verified. No webhook, messages, IAM permissions, production or CRM records were changed.').write();
      - name: Build locked isolated staging image
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = feature/awg-ads-stage-b-integration
          IMAGE="cr.yandex/crpkirscqc5gt6dgeujr/autoworld-ads-staging:$GITHUB_SHA"
          docker build -f Dockerfile.timeweb -t "$IMAGE" .
          docker run --rm --entrypoint node "$IMAGE" --input-type=module -e '
            import assert from "node:assert/strict";
            import {adsStageBConfiguration} from "./server/ads-stage-b-runtime.mjs";
            import {createTelegramService} from "./server/telegram-bot.mjs";
            assert.deepEqual(adsStageBConfiguration({}),{enabled:false});
            assert.equal(typeof createTelegramService,"function");
            console.log("ISOLATED_STAGING_IMAGE_PASS");
          '
          echo "STAGING_IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Publish only to dedicated staging registry
        run: |
          set -euo pipefail
          printf '%s' "$YC_IAM_TOKEN" | docker login --username iam --password-stdin cr.yandex
          for attempt in 1 2 3; do
            if docker push "$STAGING_IMAGE" > staging-push.log 2>&1; then
              cat staging-push.log
              break
            fi
            cat staging-push.log
            if [ "$attempt" = 3 ] || ! grep -Eqi '503 Service Unavailable|502 Bad Gateway|504 Gateway Timeout' staging-push.log; then
              exit 1
            fi
            echo "Registry temporarily unavailable; retry $attempt of 3."
            sleep "$((attempt * 5))"
          done
          docker image inspect "$STAGING_IMAGE" --format '{{json .RepoDigests}}' > staging-image-digests.json
          echo "### Dedicated staging image published" >> "$GITHUB_STEP_SUMMARY"
          echo "$STAGING_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          cat staging-image-digests.json >> "$GITHUB_STEP_SUMMARY"
          echo 'Image publication complete; guarded staging deployment follows.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: awg-ads-staging-image-identity
          path: staging-image-digests.json
          retention-days: 7
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install locked dependencies for isolated acceptance
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify isolated attribution and AutoWorld regressions before deployment
        run: |
          node --check scripts/deploy-awg-ads-telegram-staging.mjs
          node --test tests/ads-attribution*.test.mjs tests/awg-ads-*.test.mjs tests/auto-sale-ads-telegram-hook.test.mjs
          npm run check
      - name: Deploy approved staging Ads candidate and verify isolated persistence
        env:
          AWG_ADS_STAGING_DEPLOY_APPROVED: dedicated-telegram-staging-only
          AWG_ADS_STAGING_ATTRIBUTION_APPROVED: isolated-telegram-ads-only
          AWG_ADS_STAGING_TELEGRAM_BOT_TOKEN: ${{ secrets.AWG_ADS_STAGING_TELEGRAM_BOT_TOKEN }}
          AWG_ADS_STAGE_B_SUBJECT_SECRET: ${{ secrets.AWG_ADS_STAGE_B_SUBJECT_SECRET }}
          AWG_ADS_STAGING_API_KEY: ${{ secrets.AWG_ADS_STAGING_API_KEY }}
        run: |
          set -euo pipefail
          export STAGING_IMAGE_DIGEST="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("staging-image-digests.json","utf8"))[0])')"
          node --check scripts/deploy-awg-ads-telegram-staging.mjs
          node scripts/deploy-awg-ads-telegram-staging.mjs
          echo 'Dedicated Ads staging candidate deployed and synthetic signed HTTP/dual database acceptance passed. Physical Telegram user E2E remains separate acceptance.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: awg-ads-staging-attribution-acceptance
          path: staging-attribution-acceptance.json
          if-no-files-found: error
          retention-days: 7
