name: Provision AWG Timeweb staging once

on:
  push:
    branches:
      - feature/awg-timeweb-fresh-install-20261014
    paths:
      - .github/workflows/provision-awg-timeweb-once.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: awg-timeweb-staging-provision
  cancel-in-progress: false

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Resolve public SSH key from verified encrypted artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-awg-timeweb-ssh-key.sh
      - name: Preflight and create one approved Timeweb staging server
        shell: bash
        env:
          TIMEWEB_CLOUD_TOKEN: ${{ secrets.TIMEWEB_CLOUD_TOKEN }}
          AWG_TIMEWEB_PLAN_OUTPUT: ${{ runner.temp }}/awg-timeweb-server-report.json
        run: node scripts/provision-awg-timeweb-once.mjs
      - name: Save sanitized server confirmation
        uses: actions/upload-artifact@v4
        with:
          name: awg-timeweb-provision-confirmation
          path: ${{ runner.temp }}/awg-timeweb-server-report.json
          retention-days: 7
          if-no-files-found: error
