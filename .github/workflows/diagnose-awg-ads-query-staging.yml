name: Diagnose AWG Ads query service (read-only staging)
on:
  push:
    branches: [feature/awg-ads-stage-b-integration]
    paths:
      - .github/workflows/diagnose-awg-ads-query-staging.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: awg-ads-staging-maintenance
  cancel-in-progress: false
jobs:
  managed-acceptance:
    runs-on: ubuntu-24.04
    environment: awg-ads-staging
    timeout-minutes: 5
    env:
      AWG_ADS_MANAGED_ACCEPTANCE_APPROVED: reviewed-two-staging-databases
      AWG_ADS_STAGE_B_YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnseoqfsf7ojn52813t
      AWG_ADS_STAGE_B_EXPECTED_YDB_DATABASE_ID: etnseoqfsf7ojn52813t
      YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnvd9hmimkt74vpuqa6
      YC_STAGING_SA_ID: ${{ vars.AWG_ADS_STAGING_SA_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Guard exact approved repository, branch and staging identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mirozdanie6v/autoworld
          test "$GITHUB_REF_NAME" = feature/awg-ads-stage-b-integration
          test "$YC_STAGING_SA_ID" = aje3j5aat66lel86cd5r
      - name: Obtain and exchange short-lived staging OIDC without logging credentials
        uses: actions/github-script@v7
        with:
          script: |
            const jwt=await core.getIDToken('https://github.com/mirozdanie6v');
            core.setSecret(jwt);
            const c=JSON.parse(Buffer.from(jwt.split('.')[1],'base64url').toString('utf8'));
            if(c.iss!=='https://token.actions.githubusercontent.com'
              ||c.aud!=='https://github.com/mirozdanie6v'
              ||c.sub!=='repo:mirozdanie6v@49186663/autoworld@1398349654:environment:awg-ads-staging')
              throw new Error('unexpected staging OIDC claims');
            const response=await fetch('https://auth.yandex.cloud/oauth/token',{
              method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
              body:new URLSearchParams({
                grant_type:'urn:ietf:params:oauth:grant-type:token-exchange',
                requested_token_type:'urn:ietf:params:oauth:token-type:access_token',
                audience:process.env.YC_STAGING_SA_ID,subject_token:jwt,
                subject_token_type:'urn:ietf:params:oauth:token-type:id_token'
              }),signal:AbortSignal.timeout(30000)
            });
            core.info('Dedicated staging IAM exchange HTTP '+response.status);
            if(response.status!==200)throw new Error('staging token exchange failed');
            const data=await response.json();
            if(typeof data.access_token!=='string'||!data.access_token)throw new Error('missing IAM token');
            core.setSecret(data.access_token);
            core.exportVariable('YDB_ACCESS_TOKEN_CREDENTIALS',data.access_token);
            const inventory=await fetch('https://ydb.api.cloud.yandex.net/ydb/v1/databases?folderId=b1g8u8vqkgehvtbj8n13&pageSize=100',{
              headers:{Authorization:'Bearer '+data.access_token},signal:AbortSignal.timeout(30000)
            });
            if(inventory.status!==200)throw new Error('staging inventory HTTP '+inventory.status);
            const listing=await inventory.json();
            if(listing.nextPageToken)throw new Error('incomplete inventory');
            for(const [id,name] of [['etnseoqfsf7ojn52813t','awg-ads-stage-b-staging'],['etnvd9hmimkt74vpuqa6','awg-ads-crm-stage-b-staging']]){
              const db=(listing.databases||[]).find(d=>d.id===id);
              if(!db||db.name!==name||db.folderId!=='b1g8u8vqkgehvtbj8n13'||db.status!=='RUNNING')
                throw new Error('approved staging database inventory mismatch');
              core.info('Verified managed staging '+name+' '+id);
            }
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compare QueryService with SchemeService without writes
        timeout-minutes: 3
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {Driver} from '@ydbjs/core';
          import {query} from '@ydbjs/query';
          import {fromBinary} from '@bufbuild/protobuf';
          import {TableServiceDefinition,CreateSessionResultSchema} from '@ydbjs/api/table';
          import {AccessTokenCredentialsProvider} from '@ydbjs/auth/access-token';
          import {inspectAdsStagingTables} from './scripts/awg-ads-schema-inspection.mjs';
          import {ADS_ATTRIBUTION_TABLES} from './server/ads-attribution-ydb.mjs';
          const credentialsProvider=new AccessTokenCredentialsProvider({token:process.env.YDB_ACCESS_TOKEN_CREDENTIALS});
          let failures=0;
          async function probe(name,fn){
            const start=Date.now();
            try{await fn();console.log(JSON.stringify({probe:name,result:'PASS',elapsedMs:Date.now()-start}));}
            catch(e){failures++;console.log(JSON.stringify({probe:name,result:'FAIL',elapsedMs:Date.now()-start,code:e.code??null,error:String(e.message).slice(0,500)}));}
          }
          for(const [label,connection] of [['ads',process.env.AWG_ADS_STAGE_B_YDB_CONNECTION_STRING],['crm',process.env.YDB_CONNECTION_STRING]]){
            const driver=new Driver(connection,{credentialsProvider});
            try{
              await probe(label+'.discovery',()=>driver.ready());
              const sql=query(driver);
              await probe(label+'.constant',async()=>{const [rows]=await sql`SELECT 1 AS health`.isolation('snapshotReadOnly');if(Number(rows[0]?.health)!==1)throw new Error('unexpected_health');});
              if(label==='ads'){
                await probe('ads.scheme',()=>inspectAdsStagingTables(driver,new URL(connection).searchParams.get('database'),ADS_ATTRIBUTION_TABLES.concat('awg_ads_job_leases','awg_ads_job_audit')));
                await probe('ads.original_select',async()=>{await sql`SELECT * FROM awg_ads_campaigns LIMIT 1`.isolation('snapshotReadOnly');});
                await probe('ads.point_select',async()=>{await sql`SELECT token_hash FROM awg_ads_campaigns WHERE token_hash='diagnostic-nonexistent' LIMIT 1`.isolation('snapshotReadOnly');});
              }
              if(label==='crm'){
                const native=driver.createClient(TableServiceDefinition);
                for(const mode of ['onlineReadOnly','snapshotReadOnly']){
                  for(const qualified of [false,true]){
                    await probe('crm.native.'+mode+'.'+(qualified?'qualified':'relative'),async()=>{
                      const opened=await native.createSession({});
                      if(opened.operation?.status!==400000)throw new Error('session_'+opened.operation?.status);
                      const sessionId=fromBinary(CreateSessionResultSchema,opened.operation.result.value).sessionId;
                      try{
                        const table=qualified?'`'+new URL(connection).searchParams.get('database')+'/auto_sale_state`':'auto_sale_state';
                        const result=await native.executeDataQuery({sessionId,
                          query:{query:{case:'yqlText',value:'SELECT id FROM '+table+' WHERE id=1ul;'}},
                          txControl:{txSelector:{case:'beginTx',value:{txMode:{case:mode,value:{}}}},commitTx:true}
                        },{signal:AbortSignal.timeout(25000)});
                        const op=result.operation;
                        if(op?.status!==400000)throw new Error('status_'+op?.status+' '+(op?.issues||[]).map(x=>x.message).join(';').slice(0,350));
                      }finally{await native.deleteSession({sessionId}).catch(()=>{});}
                    });
                  }
                }
                await probe('crm.query.snapshot.relative',async()=>{await sql`SELECT id FROM auto_sale_state WHERE id=1ul`.isolation('snapshotReadOnly').timeout(20000);});
              }
            }finally{await driver.close();}
          }
          console.log('READ_ONLY_STAGING_DIAG_COMPLETE',JSON.stringify({failures,productionConnections:0,writes:0}));
          process.exitCode=failures?1:0;
          NODE
