name: Diagnose AWG CRM schema and SQL (synthetic staging only)
on:
  push:
    branches: [feature/awg-ads-stage-b-integration]
    paths:
      - .github/workflows/diagnose-awg-ads-query-staging.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: awg-ads-staging-maintenance
  cancel-in-progress: false
jobs:
  managed-acceptance:
    runs-on: ubuntu-24.04
    environment: awg-ads-staging
    timeout-minutes: 5
    env:
      AWG_ADS_MANAGED_ACCEPTANCE_APPROVED: reviewed-two-staging-databases
      AWG_ADS_STAGE_B_YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnseoqfsf7ojn52813t
      AWG_ADS_STAGE_B_EXPECTED_YDB_DATABASE_ID: etnseoqfsf7ojn52813t
      YDB_CONNECTION_STRING: grpcs://ydb.serverless.yandexcloud.net:2135/?database=/ru-central1/b1ggsmuiq7tb2d27f89q/etnvd9hmimkt74vpuqa6
      YC_STAGING_SA_ID: ${{ vars.AWG_ADS_STAGING_SA_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Guard exact approved repository, branch and staging identity
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mirozdanie6v/autoworld
          test "$GITHUB_REF_NAME" = feature/awg-ads-stage-b-integration
          test "$YC_STAGING_SA_ID" = aje3j5aat66lel86cd5r
      - name: Obtain and exchange short-lived staging OIDC without logging credentials
        uses: actions/github-script@v7
        with:
          script: |
            const jwt=await core.getIDToken('https://github.com/mirozdanie6v');
            core.setSecret(jwt);
            const c=JSON.parse(Buffer.from(jwt.split('.')[1],'base64url').toString('utf8'));
            if(c.iss!=='https://token.actions.githubusercontent.com'
              ||c.aud!=='https://github.com/mirozdanie6v'
              ||c.sub!=='repo:mirozdanie6v@49186663/autoworld@1398349654:environment:awg-ads-staging')
              throw new Error('unexpected staging OIDC claims');
            const response=await fetch('https://auth.yandex.cloud/oauth/token',{
              method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
              body:new URLSearchParams({
                grant_type:'urn:ietf:params:oauth:grant-type:token-exchange',
                requested_token_type:'urn:ietf:params:oauth:token-type:access_token',
                audience:process.env.YC_STAGING_SA_ID,subject_token:jwt,
                subject_token_type:'urn:ietf:params:oauth:token-type:id_token'
              }),signal:AbortSignal.timeout(30000)
            });
            core.info('Dedicated staging IAM exchange HTTP '+response.status);
            if(response.status!==200)throw new Error('staging token exchange failed');
            const data=await response.json();
            if(typeof data.access_token!=='string'||!data.access_token)throw new Error('missing IAM token');
            core.setSecret(data.access_token);
            core.exportVariable('YDB_ACCESS_TOKEN_CREDENTIALS',data.access_token);
            const inventory=await fetch('https://ydb.api.cloud.yandex.net/ydb/v1/databases?folderId=b1g8u8vqkgehvtbj8n13&pageSize=100',{
              headers:{Authorization:'Bearer '+data.access_token},signal:AbortSignal.timeout(30000)
            });
            if(inventory.status!==200)throw new Error('staging inventory HTTP '+inventory.status);
            const listing=await inventory.json();
            if(listing.nextPageToken)throw new Error('incomplete inventory');
            for(const [id,name] of [['etnseoqfsf7ojn52813t','awg-ads-stage-b-staging'],['etnvd9hmimkt74vpuqa6','awg-ads-crm-stage-b-staging']]){
              const db=(listing.databases||[]).find(d=>d.id===id);
              if(!db||db.name!==name||db.folderId!=='b1g8u8vqkgehvtbj8n13'||db.status!=='RUNNING')
                throw new Error('approved staging database inventory mismatch');
              core.info('Verified managed staging '+name+' '+id);
            }
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Probe native-created CRM schema against isolated synthetic canaries
        timeout-minutes: 4
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {Driver} from '@ydbjs/core';
          import {query} from '@ydbjs/query';
          import {fromBinary} from '@bufbuild/protobuf';
          import {TableServiceDefinition,CreateSessionResultSchema,DescribeTableResultSchema} from '@ydbjs/api/table';
          import {Type_PrimitiveTypeId as P} from '@ydbjs/api/value';
          import {AccessTokenCredentialsProvider} from '@ydbjs/auth/access-token';
          const connection=process.env.YDB_CONNECTION_STRING;
          const path='/ru-central1/b1ggsmuiq7tb2d27f89q/etnvd9hmimkt74vpuqa6';
          assert.equal(new URL(connection).searchParams.get('database'),path);
          const credentialsProvider=new AccessTokenCredentialsProvider({token:process.env.YDB_ACCESS_TOKEN_CREDENTIALS});
          const driver=new Driver(connection,{credentialsProvider});
          let failures=0,client,sessionId;
          function status(response,label){
           const op=response.operation;
           if(op?.status!==400000)throw new Error(label+' '+op?.status+' '+JSON.stringify(op?.issues));
           return op;
          }
          async function probe(name,fn){
           const start=Date.now();
           try{const details=await fn();console.log(JSON.stringify({probe:name,result:'PASS',elapsedMs:Date.now()-start,details}));return true;}
           catch(e){failures++;console.log(JSON.stringify({probe:name,result:'FAIL',elapsedMs:Date.now()-start,error:String(e.message).slice(0,1200)}));return false;}
          }
          try{
           await driver.ready();
           client=driver.createClient(TableServiceDefinition);
           sessionId=fromBinary(CreateSessionResultSchema,status(await client.createSession({}),'session').result.value).sessionId;
           const full=path+'/awg_qa_compile_canary_20261029';
           const primitive=id=>({type:{case:'typeId',value:id}});
           await probe('canary.create.native',async()=>{
            try{status(await client.describeTable({sessionId,path:full}),'exists');}
            catch(e){
             if(!/400070|SCHEME_ERROR|does not exist|not exist|Path does not exist/i.test(e.message))throw e;
             status(await client.createTable({sessionId,path:full,primaryKey:['id'],columns:[
              {name:'id',type:primitive(P.UINT64),notNull:true},
              {name:'value',type:{type:{case:'optionalType',value:{item:primitive(P.UTF8)}}}}
             ]},{signal:AbortSignal.timeout(25000)}),'create');
            }
           });
           for(const table of ['awg_qa_compile_canary_20261029','auto_sale_state','auto_sale_leads']){
            await probe(table+'.describe',async()=>{
             const r=fromBinary(DescribeTableResultSchema,status(await client.describeTable({sessionId,path:path+'/'+table}),'describe').result.value);
             return {primaryKey:r.primaryKey,columns:r.columns.map(c=>({name:c.name,notNull:c.notNull,type:c.type}))};
            });
            await probe(table+'.native.read',async()=>{
             let parts=0;for await(const part of client.streamReadTable({sessionId,path:path+'/'+table,columns:['id'],rowLimit:1n},{signal:AbortSignal.timeout(15000)})){
              if(part.status!==400000)throw new Error('stream '+part.status);parts++;
             }assert.ok(parts);return {acknowledged:true};
            });
            await probe(table+'.sql.native',async()=>{
             status(await client.executeDataQuery({sessionId,query:{query:{case:'yqlText',value:'SELECT id FROM `'+path+'/'+table+'` LIMIT 1;'}},
              operationParams:{operationTimeout:{seconds:20n},cancelAfter:{seconds:20n}},
              txControl:{txSelector:{case:'beginTx',value:{txMode:{case:'serializableReadWrite',value:{}}}},commitTx:true}
             },{signal:AbortSignal.timeout(25000)}),'sql');
            });
           }
           await probe('canary.sql.ddl',async()=>{await query(driver)`CREATE TABLE IF NOT EXISTS awg_qa_compile_yql_20261029 (id Uint64 NOT NULL, value Utf8, PRIMARY KEY(id))`.timeout(25000);});
           await probe('canary.sql.read',async()=>{await query(driver)`SELECT id FROM awg_qa_compile_canary_20261029 LIMIT 1`.timeout(25000);});
           await probe('canary.sql.write',async()=>{await query(driver)`UPSERT INTO awg_qa_compile_canary_20261029 (id,value) VALUES (1ul,'synthetic-compile-probe')`.timeout(25000);});
           await probe('canary.sql.readback',async()=>{const [rows]=await query(driver)`SELECT value FROM awg_qa_compile_canary_20261029 WHERE id=1ul`.timeout(25000);assert.equal(String(rows[0]?.value),'synthetic-compile-probe');});
           console.log('CRM_CANARY_DIAG_COMPLETE',JSON.stringify({failures,productionConnections:0,productionWrites:0,writeTargets:['awg_qa_compile_canary_20261029','awg_qa_compile_yql_20261029']}));
          }finally{
           if(sessionId)await client.deleteSession({sessionId}).catch(()=>{});
           await driver.close();
          }
          process.exitCode=failures?1:0;
          NODE
