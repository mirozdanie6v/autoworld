name: Release AWG catalog scroll optimization (static-only)
on:
  push:
    branches: [main]
    paths:
      - .production/awg-calc-scroll-release
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: awg-yandex-production-writer
  cancel-in-progress: false
env:
  YC_FOLDER_ID: b1g8u8vqkgehvtbj8n13
  YC_DEPLOY_SA_ID: ${{ vars.AWG_YC_DEPLOY_SA_ID || 'aje775bcl6hgp40eu8of' }}
  STATIC_BUCKET: viiversion-autoworld-awg-static-b1g8u8vqkgehvtbj8n13
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Validate app, preserve existing VK/Telegram paths and build frontend
        run: |
          set -euo pipefail
          npm ci
          npm run check
          bash -n scripts/release-awg-calc-scroll-static.sh
          test -s dist/auto-sale-calc-scroll-performance.css
          test -s dist/auto-sale-calc-scroll-performance.mjs
          grep -q '20261010-scroll-v1' dist/index.html
      - name: Validate glass scrolling on 45 cards in real Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test-awg-calc-scroll-browser.mjs
      - name: Request existing Yandex federation identity
        uses: actions/github-script@v7
        id: oidc
        with:
          script: |
            const token = await core.getIDToken('https://github.com/mirozdanie6v')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Exchange identity and install official Yandex CLI
        env:
          GITHUB_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=urn:ietf:params:oauth:grant-type:token-exchange' \
            --data-urlencode 'requested_token_type=urn:ietf:params:oauth:token-type:access_token' \
            --data-urlencode "audience=$YC_DEPLOY_SA_ID" \
            --data-urlencode "subject_token=$GITHUB_OIDC_TOKEN" \
            --data-urlencode 'subject_token_type=urn:ietf:params:oauth:token-type:id_token' \
            https://auth.yandex.cloud/oauth/token)
          TOKEN=$(printf '%s' "$RESPONSE" | jq -er '.access_token')
          echo "::add-mask::$TOKEN"
          echo "YC_IAM_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error --connect-timeout 15 --max-time 90 \
            https://storage.yandexcloud.net/yandexcloud-yc/release/yc_linux_amd64.tar.gz \
            -o "$RUNNER_TEMP/yc.tar.gz"
          mkdir -p "$RUNNER_TEMP/yc-dist" "$RUNNER_TEMP/yc-bin"
          tar -xzf "$RUNNER_TEMP/yc.tar.gz" -C "$RUNNER_TEMP/yc-dist"
          BIN=$(find "$RUNNER_TEMP/yc-dist" -type f -name yc -print -quit)
          test -n "$BIN"
          install -m 0755 "$BIN" "$RUNNER_TEMP/yc-bin/yc"
          echo "$RUNNER_TEMP/yc-bin" >> "$GITHUB_PATH"
      - name: Release only catalog scroll CSS/JS/index with automatic rollback and live browser smoke
        run: bash scripts/release-awg-calc-scroll-static.sh
      - name: Save mobile browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: awg-calc-scroll-production-browser
          path: |
            awg-catalog-scroll-production-mobile.png
            awg-calc-scroll-performance-mobile.png
          if-no-files-found: ignore
